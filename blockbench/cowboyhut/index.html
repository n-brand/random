<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cowboyhut – Blockbench – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ff8a4c; --line: #2a2d35; --panel: rgba(16, 18, 24, .72); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar {
      position: fixed; left: 0; right: 0; top: 0;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
    .hint { color: var(--muted); font-size: .8rem; }
    .controls {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
      display: flex; flex-direction: column; gap: 4px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
      backdrop-filter: blur(8px); max-width: calc(100% - 32px);
    }
    .controls .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    @media (max-width: 600px) {
      .controls { width: calc(100% - 32px); }
      .controls .row { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: thin; }
      .controls button, .controls a { white-space: nowrap; }
      .hint { display: none; }
    }
    .controls .downloads { border-top: 1px solid var(--line); padding-top: 4px; }
    .controls button, .controls a {
      border: 0; background: none; color: var(--text); font: inherit; font-size: .88rem;
      padding: 7px 12px; border-radius: 8px; cursor: pointer; text-decoration: none;
    }
    .controls a { color: var(--accent); }
    .controls button:hover, .controls a:hover { background: rgba(255, 255, 255, .07); }
    .controls button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .controls button:focus-visible, .controls a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
      font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none;
    }
    footer a { color: var(--accent); pointer-events: auto; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Cowboyhut &middot; Blockbench</h1>
    <span class="hint">Ziehen zum Drehen, Scrollen zum Zoomen</span>
  </div>

  <div class="controls">
    <div class="row" role="group" aria-label="Ansicht">
      <button type="button" data-figure="skin" aria-pressed="true">Mit Skin</button>
      <button type="button" data-figure="head" aria-pressed="false">Steve-Kopf</button>
      <button type="button" data-figure="none" aria-pressed="false">Nur Hut</button>
      <button type="button" id="btn-rotate" aria-pressed="true">Auto-Rotation</button>
      <button type="button" id="btn-reset">Ansicht zuruecksetzen</button>
    </div>
    <div class="row downloads" aria-label="Dateien">
      <a href="cowboyhut.bbmodel" download>Blockbench (.bbmodel)</a>
      <a href="cowboy_hat.json" download>Java-Modell (.json)</a>
      <a href="cowboy_hat.png" download>Textur (.png)</a>
    </div>
  </div>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    const HOME_TARGET = new THREE.Vector3(0, 0.45, 0);
    // Auf schmalen Bildschirmen weiter weg, damit die Krempe ganz drauf ist
    const homePos = () => new THREE.Vector3(2.6, 1.9, -3.4).multiplyScalar(Math.max(1, 1.1 / camera.aspect));
    camera.position.copy(homePos());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(HOME_TARGET);
    controls.enableDamping = true;
    controls.minDistance = 1.5;
    controls.maxDistance = 14;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;

    // Flaches Licht wie in Minecraft/Blockbench: Umgebung plus eine Richtung
    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(2, 4, -3);
    scene.add(sun);

    // 1 Modell-Einheit = 1/16, der Kopf (16 Einheiten) ist also 1 gross und sitzt im Ursprung
    const model = new THREE.Group();
    model.scale.setScalar(1 / 16);
    model.position.y = -0.5;
    scene.add(model);

    function pixelTexture(src) {
      const tex = typeof src === "string" ? new THREE.TextureLoader().load(src) : new THREE.CanvasTexture(src);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Java-Modell: Quader mit UV pro Seite (0..16) und optionaler Drehung um einen Punkt
    const FACE_ORDER = ["east", "west", "up", "down", "south", "north"];
    function buildJavaModel(json, texture) {
      const group = new THREE.Group();
      const material = new THREE.MeshLambertMaterial({ map: texture, transparent: true, alphaTest: 0.1 });
      for (const el of json.elements) {
        const size = [0, 1, 2].map(i => el.to[i] - el.from[i]);
        const geo = new THREE.BoxGeometry(...size);
        const uvAttr = geo.attributes.uv;
        FACE_ORDER.forEach((name, f) => {
          const face = el.faces[name];
          if (!face) return;
          const [u1, v1, u2, v2] = face.uv.map(v => v / 16);
          const uvs = [[u1, 1 - v1], [u2, 1 - v1], [u1, 1 - v2], [u2, 1 - v2]];
          uvs.forEach(([u, v], i) => uvAttr.setXY(f * 4 + i, u, v));
        });
        const mesh = new THREE.Mesh(geo, material);
        const center = [0, 1, 2].map(i => (el.from[i] + el.to[i]) / 2);
        const origin = el.rotation ? el.rotation.origin : center;
        const pivot = new THREE.Group();
        pivot.position.set(origin[0] - 8, origin[1], origin[2] - 8);
        if (el.rotation) pivot.rotation[el.rotation.axis] = THREE.MathUtils.degToRad(el.rotation.angle);
        mesh.position.set(center[0] - origin[0], center[1] - origin[1], center[2] - origin[2]);
        pivot.add(mesh);
        group.add(pivot);
      }
      return group;
    }

    // Steve-aehnlicher Kopf zum Groessenvergleich (8 x 8 Skin-Pixel pro Seite)
    function faceCanvas(kind) {
      const c = document.createElement("canvas");
      c.width = c.height = 8;
      const g = c.getContext("2d");
      g.fillStyle = "#b5835a"; g.fillRect(0, 0, 8, 8);
      g.fillStyle = "#3b2414";
      if (kind === "top") g.fillRect(0, 0, 8, 8);
      if (kind === "side" || kind === "back") g.fillRect(0, 0, 8, kind === "back" ? 3 : 2);
      if (kind === "front") {
        g.fillRect(0, 0, 8, 2);
        g.fillStyle = "#ffffff"; g.fillRect(1, 4, 2, 1); g.fillRect(5, 4, 2, 1);
        g.fillStyle = "#4a3a8c"; g.fillRect(2, 4, 1, 1); g.fillRect(5, 4, 1, 1);
        g.fillStyle = "#94603e"; g.fillRect(3, 5, 2, 1);
        g.fillStyle = "#6a4030"; g.fillRect(2, 6, 4, 1);
      }
      return new THREE.MeshLambertMaterial({ map: pixelTexture(c) });
    }
    const side = faceCanvas("side");
    const head = new THREE.Mesh(new THREE.BoxGeometry(16, 16, 16), [
      side, side, faceCanvas("top"), faceCanvas("bottom"), faceCanvas("back"), faceCanvas("front")
    ]);
    head.position.y = 8;
    model.add(head);

    // Ganze Spielerfigur aus einem 64x64-Skin (1 Skin-Pixel = 2 Einheiten, Kopf unten bei y = 0)
    function boxUV(geo, u, v, w, h, d) {
      // Bereiche im Skin: rechts, links, oben, unten, hinten, vorne (Reihenfolge wie BoxGeometry)
      const rects = [
        [u, v + d, d, h], [u + d + w, v + d, d, h],
        [u + d, v, w, d], [u + d + w, v, w, d],
        [u + 2 * d + w, v + d, w, h], [u + d, v + d, w, h]
      ];
      const uvAttr = geo.attributes.uv;
      rects.forEach(([x, y, rw, rh], f) => {
        const [u1, v1, u2, v2] = [x / 64, 1 - y / 64, (x + rw) / 64, 1 - (y + rh) / 64];
        [[u1, v1], [u2, v1], [u1, v2], [u2, v2]].forEach(([a, b], i) => uvAttr.setXY(f * 4 + i, a, b));
      });
    }

    function skinPart(tex, size, uv, overlayUV, pos) {
      const [w, h, d] = size;
      const part = new THREE.Group();
      part.position.set(...pos.map(p => p * 2));
      const inner = new THREE.BoxGeometry(w * 2, h * 2, d * 2);
      boxUV(inner, ...uv, w, h, d);
      part.add(new THREE.Mesh(inner, new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5 })));
      // zweite Ebene (Jacke, Haare, ...) etwas groesser
      const outer = new THREE.BoxGeometry(w * 2 + 1, h * 2 + 1, d * 2 + 1);
      boxUV(outer, ...overlayUV, w, h, d);
      part.add(new THREE.Mesh(outer, new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide })));
      return part;
    }

    async function buildPlayer(src) {
      const image = new Image();
      image.src = src;
      await image.decode();
      // Schmale Arme (Alex) erkennen: dort ist dieser Pixel durchsichtig
      const probe = document.createElement("canvas");
      probe.width = probe.height = 64;
      const pg = probe.getContext("2d");
      pg.drawImage(image, 0, 0);
      const arm = pg.getImageData(54, 20, 1, 1).data[3] === 0 ? 3 : 4;
      const tex = pixelTexture(probe);

      // Positionen in Skin-Pixeln (Mitte des Teils), Blickrichtung -z, rechte Seite +x
      const player = new THREE.Group();
      player.add(skinPart(tex, [8, 8, 8], [0, 0], [32, 0], [0, 4, 0]));
      player.add(skinPart(tex, [8, 12, 4], [16, 16], [16, 32], [0, -6, 0]));
      player.add(skinPart(tex, [arm, 12, 4], [40, 16], [40, 32], [4 + arm / 2, -6, 0]));
      player.add(skinPart(tex, [arm, 12, 4], [32, 48], [48, 48], [-4 - arm / 2, -6, 0]));
      player.add(skinPart(tex, [4, 12, 4], [0, 16], [0, 32], [2, -18, 0]));
      player.add(skinPart(tex, [4, 12, 4], [16, 48], [0, 48], [-2, -18, 0]));
      return player;
    }

    const player = await buildPlayer("skin.png");
    model.add(player);

    const json = await fetch("cowboy_hat.json").then(r => r.json());
    model.add(buildJavaModel(json, pixelTexture("cowboy_hat.png")));

    // Boden-Raster wie in Blockbench
    const grid = new THREE.GridHelper(4, 64, 0x2a2d35, 0x1a1d24);
    grid.position.y = -0.5;
    scene.add(grid);

    function bindToggle(id, onChange) {
      const btn = document.getElementById(id);
      btn.addEventListener("click", () => {
        const next = btn.getAttribute("aria-pressed") !== "true";
        btn.setAttribute("aria-pressed", String(next));
        onChange(next);
      });
    }
    bindToggle("btn-rotate", v => { controls.autoRotate = v; });

    // Figur unter dem Hut: Skin (ganzer Spieler), Steve-Kopf oder nichts
    let figure = "skin";
    function resetView() {
      const far = figure === "skin";
      camera.position.copy(homePos()).multiplyScalar(far ? 1.9 : 1).add(new THREE.Vector3(0, far ? -1.2 : 0, 0));
      controls.target.set(0, far ? -1.2 : HOME_TARGET.y, 0);
    }
    function setFigure(next) {
      figure = next;
      player.visible = next === "skin";
      head.visible = next === "head";
      grid.position.y = next === "skin" ? -3.5 : -0.5;
      document.querySelectorAll("[data-figure]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.figure === next)));
      resetView();
    }
    document.querySelectorAll("[data-figure]").forEach(b => b.addEventListener("click", () => setFigure(b.dataset.figure)));
    document.getElementById("btn-reset").addEventListener("click", resetView);
    setFigure("skin");

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      controls.update(Math.min(clock.getDelta(), 0.05));
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
