<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayne Manor 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ffd43b; --line: #2a2d35; --panel: rgba(16, 18, 24, .78); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px); max-width: calc(100% - 24px); }
    .panel button, .hud button { border: 0; background: none; color: var(--text); font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .panel button:hover, .hud button:hover { background: rgba(255, 255, 255, .08); }
    .panel button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .panel .big, .hud .big { background: var(--accent); color: #1a1405; font-weight: 800; padding: 10px 20px; }
    .panel .big:hover, .hud .big:hover { background: #ffe066; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none; }
    footer a { color: var(--accent); pointer-events: auto; }

    /* Laufmodus */
    .hud { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; gap: 8px; z-index: 5; }
    body.walk .hud { display: flex; }
    body.walk .panel, body.walk footer, body.walk .bar h1 { display: none; }
    .hud button { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    #cross { display: none; position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255, 255, 255, .8); border-radius: 50%; pointer-events: none; }
    body.walk.looking #cross { display: block; }
    #hint { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .78rem; color: var(--muted); text-align: center; pointer-events: none; }
    body.walk #hint { display: block; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; }
    #toast.show { opacity: 1; }
    .stick { display: none; position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .25); touch-action: none; z-index: 5; }
    .stick span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
    #stick-move { left: 22px; }
    #stick-look { right: 22px; }
    #btn-jump { display: none; position: fixed; right: 160px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: var(--text); font: inherit; font-size: .75rem; touch-action: none; z-index: 5; }
    body.touch.walk .stick, body.touch.walk #btn-jump { display: block; }
    body.touch #hint { display: none !important; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); background: #0b0d12; z-index: 9; }
    @media (max-width: 600px) { .bar h1 { display: none; } }
  </style>
</head>
<body>
  <div id="loading">Lade Wayne Manor...</div>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Wayne Manor &middot; 3D</h1>
    <span></span>
  </div>

  <div class="panel" role="group" aria-label="Steuerung">
    <button type="button" id="btn-walk-low" class="big">Begehen</button>
    <button type="button" id="btn-walk-top" aria-pressed="true">Karte</button>
    <button type="button" id="btn-night" aria-pressed="false">Nacht</button>
  </div>

  <div class="hud">
    <button type="button" id="btn-exit">Beenden (Esc)</button>
  </div>
  <div id="cross"></div>
  <div id="hint">WASD gehen &middot; Linksklick Maus übernehmen &middot; Leertaste springen &middot; Shift rennen &middot; Esc beenden</div>
  <div id="toast"></div>
  <div class="stick" id="stick-move"><span></span></div>
  <div class="stick" id="stick-look"><span></span></div>
  <button type="button" id="btn-jump">Sprung</button>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script>
    // PWA: gemeinsamer Service Worker im Projekt-Root
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

    // Einheiten: 1 = 1 Meter. Welt nach dem Kompass der Karten: Norden = -z, Osten = +x (Hausfront und Hauptzufahrt zeigen nach Osten).
    // Karte -> Welt: Karte oben = Westen, rechts = Norden, unten = Osten, links = Sueden; 1 Kartenpixel = 0,4 m, Nullpunkt = Mitte des Rondells.
    const $ = id => document.getElementById(id);
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const sst = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // --- Renderer, Szene, Kamera ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, matchMedia("(pointer: coarse)").matches ? 1.25 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const SKY_DAY = new THREE.Color(0x8fc4e8), SKY_NIGHT = new THREE.Color(0x070b18);
    const scene = new THREE.Scene();
    scene.background = SKY_DAY.clone();
    scene.fog = new THREE.Fog(SKY_DAY.clone(), 350, 1500);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 3000);
    camera.position.set(190, 150, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-50, 0, 20);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 900;
    controls.maxPolarAngle = Math.PI * 0.495;

    const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5a7a3a, 1.0);
    scene.add(hemi);
    const cave = new THREE.AmbientLight(0x6f8fd0, 0);
    scene.add(cave);
    const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
    const SUN_DIR = new THREE.Vector3(-0.4, 0.8, 0.5).normalize();
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 190 });
    sun.shadow.bias = -0.0004;
    scene.add(sun, sun.target);
    const world = new THREE.Group();
    scene.add(world);

    // --- Texturen und Materialien ---
    const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
    function canvasTex(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.repeat.set(rx, ry);
      return t;
    }
    const texClone = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
    const r1 = rng(11);
    const rockTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#8c8e94"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 700; i++) { const v = 90 + r1() * 90; g.fillStyle = `rgba(${v},${v},${v + 6},${0.1 + r1() * 0.25})`; g.beginPath(); g.arc(r1() * w, r1() * h, 3 + r1() * 16, 0, 7); g.fill(); }
      g.strokeStyle = "rgba(30,30,36,.35)"; g.lineWidth = 1.2;
      for (let i = 0; i < 26; i++) { g.beginPath(); let x = r1() * w, y = r1() * h; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r1() - .5) * 40; y += (r1() - .3) * 30; g.lineTo(x, y); } g.stroke(); }
    }, 1 / 8, 1 / 8);
    const brickTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#5b574f"; g.fillRect(0, 0, w, h);
      for (let row = 0; row < 16; row++) for (let i = -1; i < 8; i++) {
        const v = 128 + r1() * 40, x = i * 32 + (row % 2 ? 16 : 0);
        g.fillStyle = `rgb(${v},${v - 6},${v - 18})`; g.fillRect(x + 1, row * 16 + 1, 30, 14);
      }
    }, 1 / 4, 1 / 4);
    const woodTex = canvasTex(256, 256, (g, w, h) => {
      for (let i = 0; i < 8; i++) { const v = 90 + r1() * 40; g.fillStyle = `rgb(${v + 40},${v},${v - 30})`; g.fillRect(0, i * 32, w, 32); g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, i * 32, w, 2); }
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(40,20,5,${r1() * .15})`; g.fillRect(r1() * w, r1() * h, 30 + r1() * 60, 1); }
    }, 1 / 3, 1 / 3);
    const marbleTex = canvasTex(256, 256, (g, w, h) => {
      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? "#2b2b30" : "#d9d6cf"; g.fillRect(x * 128, y * 128, 128, 128); }
      g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, h); g.moveTo(0, 128); g.lineTo(w, 128); g.stroke();
    }, 1 / 2, 1 / 2);
    const mat = {
      rock: M(0xffffff, { map: rockTex, roughness: 1 }),
      rockDark: M(0x7d8088, { map: texClone(rockTex, 1 / 6, 1 / 6), roughness: 1, flatShading: true, side: THREE.BackSide }),
      brick: M(0xffffff, { map: brickTex, roughness: 0.95 }),
      slate: M(0x2c323d, { roughness: 0.55 }),
      floorWood: M(0xffffff, { map: woodTex }), marble: M(0xffffff, { map: marbleTex, roughness: 0.3 }),
      trim: M(0x3a2616), carpet: M(0x7a1f2b), gold: M(0xc9a24a, { metalness: 0.7, roughness: 0.35 }),
      steel: M(0x8b929c, { metalness: 0.6, roughness: 0.35 }), dark: M(0x1b1e24, { metalness: 0.3, roughness: 0.5 }),
      black: M(0x0e0f12, { roughness: 0.4 }), bat: M(0x14161b, { metalness: 0.55, roughness: 0.3 }),
      floorStone: M(0x32353d, { roughness: 0.9 }), concrete: M(0x6c6e72, { roughness: 0.95 }),
      white: M(0xf0efe9), cloth: M(0x4a5a78), red: M(0xb32d2d), green: M(0x3e7a45), wood: M(0x6a4526),
      glass: M(0x9fd0e6, { transparent: true, opacity: 0.38, roughness: 0.1, emissive: 0xffd27a, emissiveIntensity: 0 }),
      water: M(0x2e8fbf, { transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.1, emissive: 0x0b3550, emissiveIntensity: 0.4, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      glow: new THREE.MeshBasicMaterial({ color: 0xbfe6ff }), glowOrange: new THREE.MeshBasicMaterial({ color: 0xffa040 }),
      glowRed: new THREE.MeshBasicMaterial({ color: 0xff3b30 }),
      gravel: M(0xb2a891, { roughness: 1 }), leaves: M(0x2f6b3a, { roughness: 1, flatShading: true }), bark: M(0x5a3d22)
    };

    // Quader mit Texturkoordinaten in Metern; solid = Kollisionsquader (nur Welt-Gruppe)
    const solids = [];
    const circles = [];
    const S = (x0, x1, y0, y1, z0, z1, on = true) => { const s = { x0, x1, y0, y1, z0, z1, on }; solids.push(s); return s; };
    function boxUV(g, w, h, d) {
      const uv = g.attributes.uv, sc = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * sc[f][0], uv.getY(k) * sc[f][1]); }
    }
    function B(x0, x1, y0, y1, z0, z1, m, solid = true, parent = world, shadow = true) {
      const w = x1 - x0, h = y1 - y0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
      boxUV(g, w, h, d);
      const mesh = new THREE.Mesh(g, m);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      parent.add(mesh);
      if (solid && parent === world) S(x0, x1, y0, y1, z0, z1);
      return mesh;
    }
    function cyl(r0, r1, h, m, x, y, z, parent = world, seg = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m);
      mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    // Wand mit Oeffnungen [a0, a1, y0, y1, 'g' = Glasscheibe]
    function wall(axis, a0, a1, line, y0, y1, open, m, t = 0.8) {
      const seg = (a, b, ya, yb) => {
        if (yb - ya < 1e-3 || b - a < 1e-3) return;
        if (axis === "x") B(a, b, ya, yb, line - t / 2, line + t / 2, m); else B(line - t / 2, line + t / 2, ya, yb, a, b, m);
      };
      const cuts = [...new Set([a0, a1, ...open.flatMap(o => [o[0], o[1]])])].sort((p, q) => p - q);
      for (let k = 0; k < cuts.length - 1; k++) {
        const a = cuts[k], b = cuts[k + 1], mid = (a + b) / 2;
        const holes = open.filter(o => o[0] < mid && o[1] > mid).sort((p, q) => p[2] - q[2]);
        let y = y0;
        for (const h of holes) { seg(a, b, y, h[2]); y = h[3]; }
        seg(a, b, y, y1);
      }
      for (const o of open) if (o[4]) {
        if (axis === "x") B(o[0] + 0.05, o[1] - 0.05, o[2], o[3], line - 0.03, line + 0.03, mat.glass, false);
        else B(line - 0.03, line + 0.03, o[2], o[3], o[0] + 0.05, o[1] - 0.05, mat.glass, false);
      }
    }
    function gableRoof(x0, x1, z0, z1, y, rise, over, m) {
      const s = new THREE.Shape();
      s.moveTo(z0 - over, 0); s.lineTo(z1 + over, 0); s.lineTo((z0 + z1) / 2, rise); s.closePath();
      const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: x1 - x0 + 2 * over, bevelEnabled: false }), m);
      mesh.rotation.y = -Math.PI / 2;
      mesh.position.set(x1 + over, y, 0);
      mesh.castShadow = mesh.receiveShadow = true;
      world.add(mesh);
      return mesh;
    }

    const lights = [];
    const pLight = (color, I, dist, x, y, z) => { const l = { color: new THREE.Color(color), I, dist, pos: new THREE.Vector3(x, y, z) }; lights.push(l); return l; };

    // ===================== Karte -> Welt =====================
    const SC = 0.4, OX = 500, OY = 995, MAP_W = 861, MAP_H = 1202;
    const mp = (px, py) => [(py - OY) * SC, -(px - OX) * SC];                 // Karten-Pixel -> [x, z]

    // ===================== Gelaende (Schritt 2) =====================
    // Lage aus der kleinen Uebersichtskarte oben links (Massstab dort ca. 2,8-mal kleiner, Rondell bei 222/252):
    // Welt x = (py - 252) * 1,12, z = -(px - 222) * 1,12.
    const SITE = { x0: -200, x1: 150, z0: -175, z1: 270 };               // Anwesen (Kartenbereich) bleibt flach (y 0)
    const WATER_Y = -0.35, LIMIT_WORLD = 700;
    const hash2 = (i, j) => { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
    function vnoise(x, z) {
      const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
      return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v);
    }
    const fbm = (x, z) => vnoise(x, z) * 0.53 + vnoise(x * 2.1 + 17, z * 2.1 + 5) * 0.29 + vnoise(x * 4.3 + 3, z * 4.3 + 41) * 0.18;
    const LAKES = [
      { name: "Northwest Lake", cx: -238, cz: -110, rx: 44, rz: 70, s: 1.0, depth: 4 },
      { name: "Mideast Lake", cx: 180, cz: 187, rx: 52, rz: 55, s: 2.3, depth: 4 },
      { name: "Wasserfall-Teich", cx: -198, cz: -251, rx: 16, rz: 12, s: 4.1, depth: 2.5 }
    ];
    const wob = (L, a) => 1 + 0.12 * Math.sin(3 * a + L.s) + 0.07 * Math.sin(5 * a + 2 * L.s) + 0.04 * Math.sin(8 * a + 3 * L.s);
    function lakeD(L, x, z) { const ux = (x - L.cx) / L.rx, uz = (z - L.cz) / L.rz; return Math.hypot(ux, uz) / wob(L, Math.atan2(uz, ux)); }
    const LAWNS = [{ name: "West Lawn", cx: -185, cz: 40, rx: 50, rz: 80 }, { name: "South Lawn", cx: -40, cz: 228, rx: 65, rz: 42 }];
    const WATERFALL = { x: -198, z: -264 };                                  // Felskante nördlich vom Teich (Ausgang der Hoehle folgt in Schritt 8)
    const POLES = [[0, -260], [260, 0], [0, 260], [-260, 0]];
    const siteDist = (x, z) => Math.hypot(Math.max(SITE.x0 - x, 0, x - SITE.x1), Math.max(SITE.z0 - z, 0, z - SITE.z1));
    const inLawn = (x, z) => LAWNS.some(l => Math.hypot((x - l.cx) / l.rx, (z - l.cz) / l.rz) < 1);
    function genH(x, z) {
      let h = sst(0, 140, siteDist(x, z)) * fbm(x / 170 + 3, z / 170 + 9) * 16;          // sanfte Huegel ausserhalb des Anwesens
      h += 170 * sst(700, 1300, Math.hypot(x, z)) * (0.45 + 0.8 * fbm(x / 260 + 11, z / 260 + 2));   // Berge am Horizont
      for (const L of LAKES) h *= sst(1.0, 2.4, lakeD(L, x, z));                          // Seeufer flach
      const w = sst(25, 140, Math.abs(x - WATERFALL.x));
      h += 14 * sst(-262, -262 - lerp(14, 90, w), z) + 10 * sst(-300, -520, z);           // Nordhang, beim Wasserfall steil
      for (const L of LAKES) h -= L.depth * sst(1.0, 0.55, lakeD(L, x, z));
      return h;
    }
    // Walddichte 0..1 (North Forest, West Forest, sonst verstreute Gruppen)
    function forestD(x, z) {
      if (siteDist(x, z) < 8 || inLawn(x, z)) return 0;
      for (const L of LAKES) if (lakeD(L, x, z) < 1.25) return 0;
      if (Math.hypot(x - WATERFALL.x, z - WATERFALL.z - 6) < 32) return 0;
      let d = 0.08 + 0.55 * sst(0.6, 0.75, vnoise(x / 60, z / 60));
      if (z < -185 || (z < -150 && x > -260 && x < 40)) d = 0.9;
      if (x < -235) d = Math.max(d, 0.85);
      return d * sst(1000, 800, Math.hypot(x, z));
    }

    // Hoehenfeld: Gitter wird zur Mitte hin feiner (ca. 3 m am Anwesen, 22 m am Rand bei 1500 m)
    const T_N = 320, T_A = 480, T_B = 1020, TN1 = T_N + 1;
    const warp = u => Math.sign(u) * (T_A * Math.abs(u) + T_B * Math.abs(u) ** 3);
    function unwarp(x) {
      const s = Math.min(Math.abs(x), T_A + T_B);
      let t = Math.min(1, s / T_A);
      for (let k = 0; k < 6; k++) t -= (T_A * t + T_B * t * t * t - s) / (T_A + 3 * T_B * t * t);
      return Math.sign(x) * t;
    }
    const TX = Float32Array.from({ length: TN1 }, (_, i) => warp(i / (T_N / 2) - 1));
    const TH = new Float32Array(TN1 * TN1);
    for (let j = 0; j < TN1; j++) for (let i = 0; i < TN1; i++) TH[j * TN1 + i] = genH(TX[i], TX[j]);
    // Hoehe genau wie das Netz (gleiche Dreiecke), damit man weder schwebt noch einsinkt
    function terrainH(x, z) {
      const cell = v => { const i = Math.max(0, Math.min(T_N - 1, Math.floor((unwarp(v) + 1) * T_N / 2))); return [i, clamp01((v - TX[i]) / (TX[i + 1] - TX[i]))]; };
      const [i, fx] = cell(x), [j, fz] = cell(z), k = j * TN1 + i;
      const a = TH[k], b = TH[k + 1], c = TH[k + TN1], d = TH[k + TN1 + 1];
      return fx + fz <= 1 ? a + (b - a) * fx + (c - a) * fz : d + (c - d) * (1 - fx) + (b - d) * (1 - fz);
    }
    const grassTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#dcdcdc"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 4000; i++) { const v = 175 + r1() * 80; g.fillStyle = `rgba(${v - 12},${v},${v - 22},.5)`; g.fillRect(r1() * w, r1() * h, 1 + r1() * 2, 2 + r1() * 4); }
    });
    {
      const pos = new Float32Array(TN1 * TN1 * 3), uv = new Float32Array(TN1 * TN1 * 2), idx = new Uint32Array(T_N * T_N * 6);
      for (let j = 0, k = 0; j < TN1; j++) for (let i = 0; i < TN1; i++, k++) {
        pos.set([TX[i], TH[k], TX[j]], k * 3); uv.set([TX[i] / 10, -TX[j] / 10], k * 2);
      }
      for (let j = 0, n = 0; j < T_N; j++) for (let i = 0; i < T_N; i++) {
        const a = j * TN1 + i, b = a + 1, c = a + TN1, d = c + 1;
        idx.set([a, c, b, b, c, d], n); n += 6;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      g.computeVertexNormals();
      // Farben: Wiese, gemaehter Rasen, Waldboden, Sand am Ufer, Seegrund, Fels an steilen Stellen, Schnee
      const nrm = g.attributes.normal.array, col = new Float32Array(TN1 * TN1 * 3);
      const C = h => new THREE.Color(h), cMeadowA = C(0x5b8c3c), cMeadowB = C(0x739c47), cLawn = C(0x6aa84a), cForest = C(0x3b6430),
        cSand = C(0xb0a27a), cBed = C(0x5d5a46), cRock = C(0x85827c), cSnow = C(0xf2f4f6), c = new THREE.Color();
      for (let k = 0; k < TN1 * TN1; k++) {
        const x = pos[k * 3], h = pos[k * 3 + 1], z = pos[k * 3 + 2];
        c.copy(cMeadowA).lerp(cMeadowB, vnoise(x / 40, z / 40));
        c.lerp(cLawn, 0.7 * Math.max(sst(40, 0, siteDist(x, z)), inLawn(x, z) ? 1 : 0));
        c.lerp(cForest, forestD(x, z) * 0.8);
        const dl = Math.min(...LAKES.map(L => lakeD(L, x, z)));
        if (dl < 1.15) c.lerp(cSand, sst(1.15, 1.0, dl));
        if (h < WATER_Y) c.lerp(cBed, sst(WATER_Y, WATER_Y - 1, h));
        c.lerp(cRock, Math.max(sst(0.86, 0.7, nrm[k * 3 + 1]), sst(90, 160, h)));
        c.lerp(cSnow, sst(190, 240, h));
        col.set([c.r, c.g, c.b], k * 3);
      }
      g.setAttribute("color", new THREE.BufferAttribute(col, 3));
      const terrain = new THREE.Mesh(g, M(0xffffff, { map: grassTex, vertexColors: true, roughness: 1 }));
      terrain.receiveShadow = terrain.castShadow = true;
      scene.add(terrain);
    }
    // Seen (Wasserflaeche etwas groesser als der Uferrand, der Rand verschwindet im Gelaende)
    for (const L of LAKES) {
      const sh = new THREE.Shape();
      for (let k = 0; k <= 96; k++) {
        const a = k / 96 * Math.PI * 2, w = wob(L, a) * 1.02, x = L.cx + Math.cos(a) * L.rx * w, z = L.cz + Math.sin(a) * L.rz * w;
        if (k) sh.lineTo(x, -z); else sh.moveTo(x, -z);
      }
      const m = new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(-Math.PI / 2), mat.water);
      m.position.y = WATER_Y; m.receiveShadow = true;
      scene.add(m);
    }
    // Wald: Nadel- und Laubbaeume als InstancedMesh, in 400-m-Felder geteilt (Sichtpruefung je Feld, auch fuer Schatten)
    {
      function treeGeo(parts) {
        return mergeGeometries(parts.map(([geo, hex]) => {
          const g = geo.toNonIndexed(), cc = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
          for (let i = 0; i < n; i++) a.set([cc.r, cc.g, cc.b], i * 3);
          g.setAttribute("color", new THREE.BufferAttribute(a, 3));
          return g;
        }));
      }
      const conGeo = treeGeo([[new THREE.CylinderGeometry(0.22, 0.34, 3.2, 6).translate(0, 1.6, 0), 0x5a3d22], [new THREE.ConeGeometry(2.7, 6.2, 8).translate(0, 5.6, 0), 0x2d5a2e],
        [new THREE.ConeGeometry(2.0, 4.8, 8).translate(0, 8.6, 0), 0x336535], [new THREE.ConeGeometry(1.2, 3.2, 8).translate(0, 11, 0), 0x3a6e3a]]);
      const decGeo = treeGeo([[new THREE.CylinderGeometry(0.28, 0.4, 4.2, 6).translate(0, 2.1, 0), 0x5f4228], [new THREE.IcosahedronGeometry(3.3, 1).scale(1, 0.85, 1).translate(0, 6.6, 0), 0x3f7a35],
        [new THREE.IcosahedronGeometry(2.2, 1).translate(1.6, 5.6, 0.8), 0x4a8a3c]]);
      const treeMat = M(0xffffff, { vertexColors: true, roughness: 1, flatShading: true });
      const tr = rng(77), cells = new Map();
      for (let gx = -950; gx <= 950; gx += 10) for (let gz = -950; gz <= 950; gz += 10) {
        const x = gx + (tr() - 0.5) * 8, z = gz + (tr() - 0.5) * 8, pick = tr(), kind = tr(), sc = tr(), rot = tr(), tint = tr();
        let d = forestD(x, z);
        if (Math.hypot(x, z) > 450) d *= 0.55;                                   // in der Ferne lockerer (dort liegt Nebel)
        if (pick >= d || POLES.some(([px, pz]) => Math.hypot(x - px, z - pz) < 5)) continue;
        const y = terrainH(x, z);
        if (y > 150 || y < 0) continue;
        const con = kind < (z < -150 ? 0.75 : x < -235 ? 0.5 : 0.3), s = 0.75 + sc * 0.6;
        const key = Math.floor(x / 400) + "," + Math.floor(z / 400);
        if (!cells.has(key)) cells.set(key, { con: [], dec: [] });
        cells.get(key)[con ? "con" : "dec"].push([x, y - 0.2, z, s, rot * Math.PI * 2, tint]);
        if (Math.hypot(x, z) < LIMIT_WORLD + 10) circles.push([x, z, (con ? 0.32 : 0.4) * s]);
      }
      const o = new THREE.Object3D(), tc = new THREE.Color();
      let count = 0;
      for (const cell of cells.values()) for (const [type, geo] of [["con", conGeo], ["dec", decGeo]]) {
        const list = cell[type];
        if (!list.length) continue;
        const im = new THREE.InstancedMesh(geo, treeMat, list.length);
        list.forEach(([x, y, z, s, r, t], i) => {
          o.position.set(x, y, z); o.rotation.set(0, r, 0); o.scale.set(s, s * (0.9 + t * 0.25), s); o.updateMatrix();
          im.setMatrixAt(i, o.matrix);
          im.setColorAt(i, tc.setRGB(0.8 + 0.35 * t, 0.86 + 0.24 * t, 0.78 + 0.3 * (1 - t)));
        });
        im.castShadow = im.receiveShadow = true;
        im.computeBoundingSphere();
        scene.add(im);
        count += list.length;
      }
      world.userData.trees = count;
    }

    // Karte als Overlay (nur der untere Teil mit dem Anwesen; Uebersicht und Titel oben weggelassen)
    const MAP_Y0 = 560;
    const mapTex = new THREE.TextureLoader().load("karten/aussenanlage.webp");
    mapTex.colorSpace = THREE.SRGBColorSpace;
    mapTex.anisotropy = 8;
    mapTex.repeat.set(1, (MAP_H - MAP_Y0) / MAP_H);
    const mapMesh = new THREE.Mesh(new THREE.PlaneGeometry(MAP_W * SC, (MAP_H - MAP_Y0) * SC).rotateX(-Math.PI / 2).rotateY(Math.PI / 2),
      new THREE.MeshBasicMaterial({ map: mapTex, transparent: true, opacity: 0.9, depthWrite: false }));
    { const [cx, cz] = mp(MAP_W / 2, (MAP_Y0 + MAP_H) / 2); mapMesh.position.set(cx, 0.06, cz); }
    scene.add(mapMesh);
    // Himmelsrichtungen als Pfosten mit Schild (N = -z, O = +x, S = +z, W = -x), Nullpunkt rot
    function label(text, x, z, color) {
      const tex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = color; g.beginPath(); g.arc(64, 64, 58, 0, 7); g.fill(); g.fillStyle = "#fff"; g.font = "800 72px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 64, 70); });
      tex.repeat.set(1, 1);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, fog: false, depthWrite: false }));
      const gy = terrainH(x, z);
      sp.scale.set(14, 14, 1); sp.position.set(x, gy + 16, z);
      scene.add(sp);
      cyl(0.4, 0.4, 14, M(color), x, gy + 7, z, scene, 8);
    }
    label("N", 0, -260, "#2b6cb0"); label("O", 260, 0, "#c05621"); label("S", 0, 260, "#2f855a"); label("W", -260, 0, "#6b46c1");
    cyl(0.7, 0.7, 10, M(0xd13a2f), 0, 5, 0, scene, 10);

    // ===================== Tag und Nacht =====================
    let night = 0, nightTarget = 0;
    const SUN_DAYC = new THREE.Color(0xfff2d6), SUN_NIGHTC = new THREE.Color(0x7f9ce8);
    function applyNight() {
      scene.background.copy(SKY_DAY).lerp(SKY_NIGHT, night);
      scene.fog.color.copy(scene.background);
      sun.color.copy(SUN_DAYC).lerp(SUN_NIGHTC, night);
      sun.intensity = lerp(2.4, 0.5, night);
      hemi.intensity = lerp(1.0, 0.16, night);
    }
    applyNight();

    // ===================== Laufmodus =====================
    const touch = matchMedia("(pointer: coarse)").matches;
    document.body.classList.toggle("touch", touch);
    const EYE = 1.62, BODY = 1.8, RADIUS = 0.3, STEP = 0.45, WALK = 4.6, RUN = 9, JUMP = 6.4, GRAVITY = 22, LIMIT = LIMIT_WORLD;
    const START = { x: 70, z: 0, yaw: Math.PI / 2 };                          // Blick nach Westen auf das Rondell
    const player = { pos: new THREE.Vector3(START.x, 0, START.z), vy: 0, yaw: START.yaw, pitch: 0.05, onGround: true, jump: false };
    const keys = new Set();
    let walking = false, dragging = false, jumpHeld = false;
    const orbitView = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
    function pushOut(p, feet) {
      for (const s of solids) {
        if (!s.on || s.y1 <= feet + STEP || s.y0 >= feet + BODY) continue;
        const cx = Math.max(s.x0, Math.min(p.x, s.x1)), cz = Math.max(s.z0, Math.min(p.z, s.z1));
        const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
        if (d2 >= RADIUS * RADIUS) continue;
        if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * RADIUS; p.z = cz + dz / d * RADIUS; }
        else {
          const out = [[p.x - s.x0, -1, 0], [s.x1 - p.x, 1, 0], [p.z - s.z0, 0, -1], [s.z1 - p.z, 0, 1]].sort((a, b) => a[0] - b[0])[0];
          p.x += out[1] * (out[0] + RADIUS); p.z += out[2] * (out[0] + RADIUS);
        }
      }
      for (const [cx, cz, r, top] of circles) {
        if (top !== undefined && feet >= top) continue;
        const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz), min = r + RADIUS;
        if (d < min && d > 1e-6) { p.x = cx + dx / d * min; p.z = cz + dz / d * min; }
      }
      const far = Math.hypot(p.x, p.z);
      if (far > LIMIT) { p.x *= LIMIT / far; p.z *= LIMIT / far; }
    }
    function supportAt(p, feet) {
      let top = terrainH(p.x, p.z);
      for (const s of solids) {
        if (!s.on || s.y1 > feet + STEP || s.y1 <= top) continue;
        if (p.x > s.x0 - 0.05 && p.x < s.x1 + 0.05 && p.z > s.z0 - 0.05 && p.z < s.z1 + 0.05) top = s.y1;
      }
      return top;
    }
    function updatePlayer(dt, moveX, moveZ, run) {
      const len = Math.hypot(moveX, moveZ);
      if (len > 1) { moveX /= len; moveZ /= len; }
      const speed = run ? RUN : WALK, sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
      const next = player.pos.clone();
      next.x += (-sin * moveZ + cos * moveX) * speed * dt;
      next.z += (-cos * moveZ - sin * moveX) * speed * dt;
      pushOut(next, player.pos.y);
      if (supportAt(next, player.pos.y) < WATER_Y - 0.5) { next.x = player.pos.x; next.z = player.pos.z; }   // nicht in tiefes Wasser
      const g0 = terrainH(player.pos.x, player.pos.z), g1 = terrainH(next.x, next.z), moved = Math.hypot(next.x - player.pos.x, next.z - player.pos.z);
      if (moved > 1e-6 && g1 - g0 > 1.1 * moved && player.pos.y < g0 + 0.15) { next.x = player.pos.x; next.z = player.pos.z; }
      player.pos.x = next.x; player.pos.z = next.z;
      const wasGround = player.onGround;
      if (player.jump && player.onGround) { player.vy = JUMP; player.onGround = false; }
      player.vy -= GRAVITY * dt;
      player.jump = false;
      player.pos.y += player.vy * dt;
      const support = supportAt(player.pos, player.pos.y);
      if (player.pos.y <= support || (wasGround && player.vy <= 0 && player.pos.y - support < 0.35)) { player.pos.y = support; player.vy = 0; player.onGround = true; } else player.onGround = false;
      for (const s of solids) {
        if (!s.on || s.y0 <= player.pos.y + STEP || s.y0 >= player.pos.y + BODY) continue;
        const cx = Math.max(s.x0, Math.min(player.pos.x, s.x1)), cz = Math.max(s.z0, Math.min(player.pos.z, s.z1));
        if ((player.pos.x - cx) ** 2 + (player.pos.z - cz) ** 2 >= (RADIUS * 0.7) ** 2) continue;
        player.pos.y = s.y0 - BODY; player.vy = Math.min(player.vy, 0);
      }
      camera.position.set(player.pos.x, player.pos.y + EYE, player.pos.z);
      camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");
    }
    const look = (dx, dy) => { player.yaw -= dx; player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - dy)); };
    function stopDrag() {
      dragging = false;
      document.body.classList.remove("looking");
      if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
    }
    function startWalk(x = START.x, z = START.z, yaw = START.yaw) {
      if (!walking) { orbitView.pos.copy(camera.position); orbitView.target.copy(controls.target); }
      walking = true;
      document.body.classList.add("walk");
      controls.enabled = false;
      player.pos.set(x, terrainH(x, z), z); player.yaw = yaw; player.pitch = 0.05; player.vy = 0;
      camera.fov = 70; camera.updateProjectionMatrix();
      updatePlayer(0.001, 0, 0, false);
    }
    function setWalk(on) {
      if (on) return startWalk();
      walking = false;
      document.body.classList.remove("walk");
      controls.enabled = true;
      stopDrag(); keys.clear();
      camera.fov = 45; camera.updateProjectionMatrix();
      camera.position.copy(orbitView.pos); controls.target.copy(orbitView.target); camera.lookAt(orbitView.target);
    }
    $("btn-walk-low").addEventListener("click", () => startWalk());
    $("btn-walk-top").addEventListener("click", e => { mapMesh.visible = !mapMesh.visible; e.currentTarget.setAttribute("aria-pressed", String(mapMesh.visible)); });
    $("btn-exit").addEventListener("click", () => setWalk(false));
    renderer.domElement.addEventListener("mousedown", e => {
      if (!walking || touch || e.button !== 0) return;
      e.preventDefault();
      if (dragging) return stopDrag();
      dragging = true;
      document.body.classList.add("looking");
      renderer.domElement.requestPointerLock?.()?.catch?.(() => {});
    });
    document.addEventListener("pointerlockchange", () => { if (!document.pointerLockElement && dragging) { stopDrag(); setWalk(false); } });
    document.addEventListener("mousemove", e => { if (dragging) look(e.movementX * 0.0025, e.movementY * 0.0025); });
    addEventListener("keydown", e => {
      if (!walking) return;
      if (e.code === "Escape") return setWalk(false);
      keys.add(e.code);
      if (e.code === "Space") { player.jump = true; e.preventDefault(); }
    });
    addEventListener("keyup", e => keys.delete(e.code));
    addEventListener("blur", () => keys.clear());
    function joystick(el) {
      const knob = el.querySelector("span"), state = { x: 0, y: 0, id: null };
      const move = e => {
        const r = el.getBoundingClientRect(), max = r.width / 2 - 20;
        let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
        const len = Math.hypot(x, y);
        if (len > max) { x *= max / len; y *= max / len; }
        state.x = x / max; state.y = y / max;
        knob.style.transform = `translate(${x}px, ${y}px)`;
      };
      el.addEventListener("pointerdown", e => { state.id = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (err) {} move(e); });
      el.addEventListener("pointermove", e => { if (e.pointerId === state.id) move(e); });
      const end = e => { if (e.pointerId !== state.id) return; state.id = null; state.x = 0; state.y = 0; knob.style.transform = ""; };
      el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
      return state;
    }
    const moveStick = joystick($("stick-move")), lookStick = joystick($("stick-look"));
    $("btn-jump").addEventListener("pointerdown", e => { e.preventDefault(); player.jump = true; jumpHeld = true; });
    for (const type of ["pointerup", "pointercancel", "pointerleave"]) $("btn-jump").addEventListener(type, () => { jumpHeld = false; });
    function walkStep(dt) {
      let mx = 0, mz = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) mz += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) mz -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) mx += 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) mx -= 1;
      mx += moveStick.x; mz -= moveStick.y;
      look(lookStick.x * 2.6 * dt, lookStick.y * 1.8 * dt);
      updatePlayer(dt, mx, mz, keys.has("ShiftLeft") || keys.has("ShiftRight"));
    }
    $("btn-night").addEventListener("click", e => { nightTarget = nightTarget ? 0 : 1; e.currentTarget.setAttribute("aria-pressed", String(!!nightTarget)); });
    addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===================== Schleife =====================
    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (walking) walkStep(dt);
      else { controls.update(); const gy = terrainH(camera.position.x, camera.position.z) + 3; if (camera.position.y < gy) camera.position.y = gy; }
      const rn = night < nightTarget ? Math.min(nightTarget, night + dt * 0.8) : Math.max(nightTarget, night - dt * 0.8);
      if (rn !== night) { night = rn; applyNight(); }
      const focus = walking ? player.pos : controls.target;
      sun.position.copy(focus).addScaledVector(SUN_DIR, 90);
      sun.target.position.copy(focus);
      sun.target.updateMatrixWorld();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(() => { $("loading").remove(); });
    frame();

    // ?debug: Spieler und Umrechnung von aussen steuerbar (fuer Tests im Browser)
    if (location.search.includes("debug")) {
      window.manorDebug = { player, update: updatePlayer, setWalk, startWalk, terrainH, genH, forestD, LAKES, solids, circles, camera, controls, renderer, scene, mp, mapMesh };
    }
  </script>
