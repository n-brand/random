<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayne Manor 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ffd43b; --line: #2a2d35; --panel: rgba(16, 18, 24, .78); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px); max-width: calc(100% - 24px); }
    .panel button, .hud button { border: 0; background: none; color: var(--text); font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .panel button:hover, .hud button:hover { background: rgba(255, 255, 255, .08); }
    .panel button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .panel .big, .hud .big { background: var(--accent); color: #1a1405; font-weight: 800; padding: 10px 20px; }
    .panel .big:hover, .hud .big:hover { background: #ffe066; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none; }
    footer a { color: var(--accent); pointer-events: auto; }

    /* Laufmodus */
    .hud { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; gap: 8px; z-index: 5; }
    body.walk .hud { display: flex; }
    body.walk .panel, body.walk footer, body.walk .bar h1 { display: none; }
    .hud button { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    #cross { display: none; position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255, 255, 255, .8); border-radius: 50%; pointer-events: none; }
    body.walk.looking #cross { display: block; }
    #hint { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .78rem; color: var(--muted); text-align: center; pointer-events: none; }
    body.walk #hint { display: block; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; }
    #toast.show { opacity: 1; }
    #lift-panel { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; backdrop-filter: blur(8px); z-index: 6; }
    #lift-panel[hidden] { display: none; }
    #door-hint { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; color: var(--text); font: inherit; font-size: .85rem; backdrop-filter: blur(8px); z-index: 6; cursor: pointer; }
    #door-hint[hidden] { display: none; }
    #teleport { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; font-size: .85rem; padding: 7px 10px; border-radius: 9px; cursor: pointer; }
    #teleport { color-scheme: dark; }
    #teleport option { color: #f2f4f8; background: #1f232b; }
    #tp-menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 120px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; backdrop-filter: blur(10px); z-index: 8; }
    #tp-menu[hidden] { display: none; }
    #tp-menu .tp-head { font-size: .8rem; color: var(--muted); margin-bottom: 8px; text-align: center; }
    #tp-menu .tp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
    #tp-menu button { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; font-size: .85rem; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
    #tp-menu button:hover { background: var(--accent); color: #1a1405; }
    #lift-panel .lp-title { font-size: .72rem; color: var(--muted); text-align: center; }
    #lift-panel button { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; font-size: .85rem; padding: 7px 12px; border-radius: 8px; cursor: pointer; text-align: left; white-space: nowrap; }
    #lift-panel button.here { background: var(--text); color: #0b0d12; font-weight: 800; }
    #lift-panel button.target { background: var(--accent); color: #1a1405; font-weight: 800; }
    .stick { display: none; position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .25); touch-action: none; z-index: 5; }
    .stick span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
    #stick-move { left: 22px; }
    #stick-look { right: 22px; }
    #btn-jump { display: none; position: fixed; right: 160px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: var(--text); font: inherit; font-size: .75rem; touch-action: none; z-index: 5; }
    body.touch.walk .stick, body.touch.walk #btn-jump { display: block; }
    body.touch #hint { display: none !important; }
    /* Zeichnen: pinke Markierungen ueber dem Bild (fuer Screenshots) */
    #draw-layer { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; cursor: crosshair; }
    body.drawing #draw-layer { pointer-events: auto; }
    body.walk #draw-layer, body.walk #draw-colors { display: none; }
    .panel { z-index: 7; }
    .panel #btn-draw[aria-pressed="true"] { background: var(--pen, #ff2fa8); color: #111; font-weight: 800; }
    #draw-colors { display: none; position: fixed; left: 16px; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; backdrop-filter: blur(8px); z-index: 7; }
    body.drawing #draw-colors { display: flex; }
    #draw-colors button { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); background: var(--c); cursor: pointer; transition: transform .15s ease; }
    #draw-colors button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .6); transform: scale(1.15); }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); background: #0b0d12; z-index: 9; }
    /* Geistmodus: Anzeige oben, kein Aufzug-Knopf, am Handy Hoch/Runter statt Sprung */
    #ghost-tag { display: none; position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 16px; font-weight: 800; letter-spacing: .08em; color: #bfe3ff; pointer-events: none; z-index: 6; }
    body.ghost #ghost-tag { display: block; }
    body.ghost #btn-lift { display: none; }
    #btn-down { display: none; position: fixed; right: 160px; bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: var(--text); font: inherit; font-size: .75rem; touch-action: none; z-index: 5; }
    body.touch.ghost #btn-down { display: block; }
    @media (max-width: 600px) { .bar h1 { display: none; } #ghost-tag { top: calc(env(safe-area-inset-top, 0px) + 60px); } }
  </style>
</head>
<body>
  <div id="loading">Lade Wayne Manor...</div>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Wayne Manor &middot; 3D</h1>
    <span></span>
  </div>

  <div class="panel" role="group" aria-label="Steuerung">
    <button type="button" id="btn-walk-low" class="big">Begehen</button>
    <button type="button" id="btn-ghost" title="Durch alles fliegen: WASD, Leertaste hoch, Shift runter, Esc zurück">Geist</button>
    <button type="button" id="btn-walk-top" aria-pressed="false">Karte: aus</button>
    <button type="button" id="btn-night" aria-pressed="false">Nacht</button>
    <button type="button" id="btn-below" aria-pressed="false">Von unten</button>
    <button type="button" id="btn-draw" aria-pressed="false" title="Farbig einzeichnen, nochmal klicken löscht die Zeichnung">Zeichnen</button>
    <!-- TEST: Teleport zum Testen, wird ganz am Ende entfernt -->
    <select id="teleport" aria-label="Teleport (Test)"><option value="">Teleport (Test)…</option></select>
  </div>

  <div class="hud">
    <button type="button" id="btn-lift">Aufzug (E)</button>
    <button type="button" id="btn-exit">Beenden (Esc)</button>
  </div>
  <div id="cross"></div>
  <div id="ghost-tag">Geist</div>
  <div id="hint">WASD gehen &middot; Linksklick Maus übernehmen &middot; Leertaste springen &middot; Shift rennen &middot; Esc beenden</div>
  <div id="toast"></div>
  <canvas id="draw-layer"></canvas>
  <div id="draw-colors" role="group" aria-label="Stiftfarbe"></div>
  <div id="lift-panel" hidden></div>
  <button type="button" id="door-hint" hidden></button>
  <!-- TEST: Teleport-Menue (Taste T), wird ganz am Ende entfernt -->
  <div id="tp-menu" hidden><div class="tp-head">Teleport (Test) &middot; T oder Esc schließt</div><div class="tp-list"></div></div>
  <div class="stick" id="stick-move"><span></span></div>
  <div class="stick" id="stick-look"><span></span></div>
  <button type="button" id="btn-jump">Sprung</button>
  <button type="button" id="btn-down">Runter</button>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script>
    // PWA: gemeinsamer Service Worker im Projekt-Root
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { installOrbitPick } from "../../shared/orbit-pick.js";
    import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

    // Einheiten: 1 = 1 Meter. Welt nach dem Kompass der Karten: Norden = -z, Osten = +x (Hausfront und Hauptzufahrt zeigen nach Osten).
    // Karte -> Welt: Karte oben = Westen, rechts = Norden, unten = Osten, links = Sueden; 1 Kartenpixel = 0,4 m, Nullpunkt = Mitte des Rondells.
    const $ = id => document.getElementById(id);
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const sst = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // --- Renderer, Szene, Kamera ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });   // genaue Tiefe auch von weit weg (kein Flackern)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, matchMedia("(pointer: coarse)").matches ? 1.25 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const SKY_DAY = new THREE.Color(0x8fc4e8), SKY_NIGHT = new THREE.Color(0x070b18);
    const scene = new THREE.Scene();
    scene.background = SKY_DAY.clone();
    scene.fog = new THREE.Fog(SKY_DAY.clone(), 350, 1500);
    // A2 (2026-11-07): Anwesen auf einem Plateau, HILL Meter ueber der Umgebung. Gebaut wird alles wie bisher mit Boden y 0,
    // danach hebt liftPlateau() (vor dem Zusammenfassen) alles auf dem Plateau samt Kollision an. Hoehlen bleiben, wo sie sind.
    const HILL = 25;
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.6, 3000);
    camera.position.set(95, 75 + HILL, 60);
    const controls = new OrbitControls(camera, renderer.domElement);
    installOrbitPick({ renderer, camera, controls, scene });   // Rechtsklick in der Orbit-Ansicht: Koordinaten in die Zwischenablage
    controls.target.set(-25, HILL, 10);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 900;
    controls.maxPolarAngle = Math.PI * 0.495;

    const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5a7a3a, 1.0);
    scene.add(hemi);
    const cave = new THREE.AmbientLight(0xdfe3ea, 0);
    scene.add(cave);
    const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
    const SUN_DIR = new THREE.Vector3(-0.4, 0.8, 0.5).normalize();
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 190 });
    sun.shadow.bias = -0.0004;
    scene.add(sun, sun.target);
    const world = new THREE.Group();
    scene.add(world);

    // --- Texturen und Materialien ---
    const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
    function canvasTex(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.repeat.set(rx, ry);
      return t;
    }
    const texClone = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
    const r1 = rng(11);
    const rockTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#8c8e94"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 700; i++) { const v = 90 + r1() * 90; g.fillStyle = `rgba(${v},${v},${v + 6},${0.1 + r1() * 0.25})`; g.beginPath(); g.arc(r1() * w, r1() * h, 3 + r1() * 16, 0, 7); g.fill(); }
      g.strokeStyle = "rgba(30,30,36,.35)"; g.lineWidth = 1.2;
      for (let i = 0; i < 26; i++) { g.beginPath(); let x = r1() * w, y = r1() * h; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r1() - .5) * 40; y += (r1() - .3) * 30; g.lineTo(x, y); } g.stroke(); }
    }, 1 / 8, 1 / 8);
    const brickTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#5b574f"; g.fillRect(0, 0, w, h);
      for (let row = 0; row < 16; row++) for (let i = -1; i < 8; i++) {
        const v = 128 + r1() * 40, x = i * 32 + (row % 2 ? 16 : 0);
        g.fillStyle = `rgb(${v},${v - 6},${v - 18})`; g.fillRect(x + 1, row * 16 + 1, 30, 14);
      }
    }, 1 / 4, 1 / 4);
    const woodTex = canvasTex(256, 256, (g, w, h) => {
      for (let i = 0; i < 8; i++) { const v = 90 + r1() * 40; g.fillStyle = `rgb(${v + 40},${v},${v - 30})`; g.fillRect(0, i * 32, w, 32); g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, i * 32, w, 2); }
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(40,20,5,${r1() * .15})`; g.fillRect(r1() * w, r1() * h, 30 + r1() * 60, 1); }
    }, 1 / 3, 1 / 3);
    const marbleTex = canvasTex(256, 256, (g, w, h) => {
      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? "#2b2b30" : "#d9d6cf"; g.fillRect(x * 128, y * 128, 128, 128); }
      g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, h); g.moveTo(0, 128); g.lineTo(w, 128); g.stroke();
    }, 1 / 2, 1 / 2);
    const mat = {
      rock: M(0xffffff, { map: rockTex, roughness: 1 }),
      rockDark: M(0x7d8088, { map: texClone(rockTex, 1 / 6, 1 / 6), roughness: 1, flatShading: true, side: THREE.BackSide }),
      brick: M(0xffffff, { map: brickTex, roughness: 0.95 }),
      slate: M(0x2c323d, { roughness: 0.55 }),
      floorWood: M(0xffffff, { map: woodTex }), marble: M(0xffffff, { map: marbleTex, roughness: 0.3 }),
      trim: M(0x3a2616), carpet: M(0x7a1f2b), gold: M(0xc9a24a, { metalness: 0.7, roughness: 0.35 }),
      steel: M(0x8b929c, { metalness: 0.6, roughness: 0.35 }), dark: M(0x1b1e24, { metalness: 0.3, roughness: 0.5 }),
      black: M(0x0e0f12, { roughness: 0.4 }), bat: M(0x14161b, { metalness: 0.55, roughness: 0.3 }),
      floorStone: M(0x32353d, { roughness: 0.9 }), concrete: M(0x6c6e72, { roughness: 0.95 }),
      white: M(0xf0efe9), cloth: M(0x4a5a78), red: M(0xb32d2d), green: M(0x3e7a45), wood: M(0x6a4526),
      glass: M(0x9fd0e6, { transparent: true, opacity: 0.38, roughness: 0.1, emissive: 0xffd27a, emissiveIntensity: 0 }),
      water: M(0x2e8fbf, { transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.1, emissive: 0x0b3550, emissiveIntensity: 0.4, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      glow: new THREE.MeshBasicMaterial({ color: 0xbfe6ff }), glowOrange: new THREE.MeshBasicMaterial({ color: 0xffa040 }),
      glowRed: new THREE.MeshBasicMaterial({ color: 0xff3b30 }),
      gravel: M(0xb2a891, { roughness: 1 }), leaves: M(0x2f6b3a, { roughness: 1, flatShading: true }), bark: M(0x5a3d22)
    };

    // Quader mit Texturkoordinaten in Metern; solid = Kollisionsquader (nur Welt-Gruppe)
    const solids = [];
    const circles = [];
    let NOLIFT = false;                                                       // true: Teil wird schon in Endhoehe gebaut (liftPlateau laesst es aus)
    const S = (x0, x1, y0, y1, z0, z1, on = true) => { const s = { x0, x1, y0, y1, z0, z1, on, noLift: NOLIFT }; solids.push(s); return s; };
    function boxUV(g, w, h, d) {
      const uv = g.attributes.uv, sc = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * sc[f][0], uv.getY(k) * sc[f][1]); }
    }
    function B(x0, x1, y0, y1, z0, z1, m, solid = true, parent = world, shadow = true) {
      const w = x1 - x0, h = y1 - y0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
      boxUV(g, w, h, d);
      const mesh = new THREE.Mesh(g, m);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      if (NOLIFT) mesh.userData.noLift = true;
      parent.add(mesh);
      if (solid && parent === world) S(x0, x1, y0, y1, z0, z1);
      return mesh;
    }
    function cyl(r0, r1, h, m, x, y, z, parent = world, seg = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m);
      mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    // Wand mit Oeffnungen [a0, a1, y0, y1, 'g' = Glasscheibe]
    function wall(axis, a0, a1, line, y0, y1, open, m, t = 0.8) {
      const seg = (a, b, ya, yb) => {
        if (yb - ya < 1e-3 || b - a < 1e-3) return;
        if (axis === "x") B(a, b, ya, yb, line - t / 2, line + t / 2, m); else B(line - t / 2, line + t / 2, ya, yb, a, b, m);
      };
      const cuts = [...new Set([a0, a1, ...open.flatMap(o => [o[0], o[1]])])].sort((p, q) => p - q);

            const ledge = (0.4 + 0.9 * vnoise(a / 14, Math.floor(lay) * 3.1)) * sst(0.7, 0.96, f);
            const rough = 1.3 * (fbm(a / 11 + 3, y / 9 + 5) - 0.5) + 0.45 * (vnoise(a / 2.8, y / 2.4) - 0.5);
            const crack = -0.7 * Math.pow(1 - Math.abs(Math.sin(a / 6.5 + 3 * vnoise(a / 20, y / 15))), 16);
            const shelf = 1.4 * sst(0.55, 0.7, vnoise(a / 55 + 9, 2)) * sst(SEA_Y + 3.4, SEA_Y + 2.2, y) * sst(SEA_Y + 0.6, SEA_Y + 1.6, y);
            const notch = -0.9 * Math.max(0, 1 - Math.abs(y - (SEA_Y + 0.6)) / 1.6);
            let o = 0.45 * cw + ledge + rough + crack + shelf + notch;
            o = Math.max(o, lerp(-0.62 * cw, 0.38 * cw, q) + 0.5);               // immer vor der groben Gelaende-Klippe
            o = lerp(o, -0.85 * cw, sst(top - 1.8, top + 0.25, y));               // oben ueber die Kante zurueck aufs Land
            pos.push(x + nx * o, y, z + nz * o); uv.push(a / 5, y / 5);
            tc.copy(cCliff).lerp(cBeige, 0.5 * vnoise(a / 30 + 2, Math.floor(lay) * 1.7)).multiplyScalar(1.05 + 0.32 * vnoise(a / 7, y / 5) + 0.16 * ledge + 3 * Math.min(0, crack) * 0.1);   // etwas heller: die Kueste liegt meist im Schatten
            if (y < SEA_Y + 1.4) tc.lerp(cWet, sst(SEA_Y + 1.4, SEA_Y + 0.3, y) * 0.75);
            if (y > SEA_Y - 0.2 && y < SEA_Y + 1.1) tc.lerp(cAlgae, 0.45 * sst(0.3, 0.7, vnoise(a / 4, 5)));
            col.push(tc.r, tc.g, tc.b);
          }
        }
        for (let i = 0; i < line.length - 1; i++) for (let j = 0; j < NR; j++) {
          const a0 = base + i * (NR + 1) + j, b0 = a0 + NR + 1;
          const mx = (line[i][0] + line[i + 1][0]) / 2, mz = (line[i][1] + line[i + 1][1]) / 2, my = (pos[a0 * 3 + 1] + pos[a0 * 3 + 4]) / 2;
          if (inHole(mx, mz, my)) continue;
          idx.push(a0, b0, a0 + 1, a0 + 1, b0, b0 + 1);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx); g.computeVertexNormals();
      const cliffTex = texClone(rockTex, 1, 1);
      const skin = new THREE.Mesh(g, M(0xffffff, { vertexColors: true, map: cliffTex, bumpMap: cliffTex, bumpScale: 2, roughness: 0.95, side: THREE.DoubleSide }));
      skin.castShadow = skin.receiveShadow = true; skin.userData.keep = true; scene.add(skin);
      // ---- Hoehlenroehren (halbe Ellipse, nach hinten schmaler und dunkler), Wasser darin, Kollision an den Seiten ----
      const tp = [], tcol = [], tidx = [], wp = [], widx = [];
      for (const h of holes) {
        const cw = cwAt(h.cx, h.cz), NA = 16, NRG = 14, v0 = -(0.45 * cw + 1.2), taper = h.open ? 0 : 0.38, b0 = tp.length / 3, w0 = wp.length / 3;
        for (let k = 0; k <= NRG; k++) {
          const v = lerp(v0, h.d, k / NRG), f = clamp01(v / h.d) ** 1.2, a = h.w / 2 * (1 - taper * f) + 0.3, bb = h.h * (1 - (h.open ? 0 : 0.3) * f) + 0.3;
          for (let m = 0; m <= NA; m++) {
            const th = Math.PI * m / NA, r = 1 + 0.12 * (vnoise(k * 0.9 + h.cx, m * 0.8) - 0.5), u = a * Math.cos(th) * r, y = SEA_Y - 2.5 + (bb + 2.5) * Math.sin(th) * r;
            tp.push(h.cx - h.nx * v - h.nz * u, y, h.cz - h.nz * v + h.nx * u);
            tc.copy(cCliff).multiplyScalar(lerp(0.85, h.open ? 0.3 : 0.12, (k / NRG)) * (0.85 + 0.3 * vnoise(k, m)));
            if (y < SEA_Y + 1) tc.lerp(cWet, 0.6);
            tcol.push(tc.r, tc.g, tc.b);
          }
          for (const s of [-1, 1]) { wp.push(h.cx - h.nx * v - h.nz * s * a * 0.98, SEA_Y - 0.02, h.cz - h.nz * v + h.nx * s * a * 0.98); }
          if (k) { const p0 = b0 + (k - 1) * (NA + 1), p1 = p0 + NA + 1; for (let m = 0; m < NA; m++) tidx.push(p0 + m, p1 + m, p0 + m + 1, p0 + m + 1, p1 + m, p1 + m + 1);
            const q0 = w0 + (k - 1) * 2; widx.push(q0, q0 + 2, q0 + 1, q0 + 1, q0 + 2, q0 + 3); }
          if (v > 0 && !h.open) for (const s of [-1, 1]) circles.push([h.cx - h.nx * v - h.nz * s * a, h.cz - h.nz * v + h.nx * s * a, 0.6, SEA_Y + h.h + 1]);
        }
        if (!h.open) {                                                          // Rueckwand
          const last = b0 + NRG * (NA + 1), c = tp.length / 3, [ex, ez] = [h.cx - h.nx * (h.d + 0.6), h.cz - h.nz * (h.d + 0.6)];
          tp.push(ex, SEA_Y + h.h * 0.3, ez); tcol.push(cWet.r * 0.4, cWet.g * 0.4, cWet.b * 0.4);
          for (let m = 0; m < NA; m++) tidx.push(last + m, c, last + m + 1);
          tidx.push(last + NA, c, last);                                    // unten zwischen den Enden schliessen
          circles.push([ex + h.nx * 0.6, ez + h.nz * 0.6, h.w * 0.3, SEA_Y + h.h + 1]);
        }
      }
      const tg = new THREE.BufferGeometry(); tg.setAttribute("position", new THREE.Float32BufferAttribute(tp, 3)); tg.setAttribute("color", new THREE.Float32BufferAttribute(tcol, 3)); tg.setIndex(tidx); tg.computeVertexNormals();
      const tubes = new THREE.Mesh(tg, M(0xffffff, { vertexColors: true, roughness: 1, side: THREE.DoubleSide })); tubes.receiveShadow = true; tubes.userData.keep = true; scene.add(tubes);
      const wg = new THREE.BufferGeometry(); wg.setAttribute("position", new THREE.Float32BufferAttribute(wp, 3)); wg.setIndex(widx); wg.computeVertexNormals();
      const cwater = new THREE.Mesh(wg, mat.sea); cwater.userData.keep = true; scene.add(cwater);
      // ---- Felsnadeln und Brocken am Fuss (Felsgenerator, in Klippenfarbe) ----
      const geos = [], sr = rng(919);
      for (const st of SEA_STACKS) {
        const H = st.h + 8, g2 = makeRock(st.r, H / 2, st.r * 0.9, sr(), 4), P = g2.attributes.position;
        for (let q = 0; q < P.count; q++) { const f = clamp01((P.getY(q) + H / 2) / H), k = lerp(1.15, 0.45, f); P.setX(q, P.getX(q) * k); P.setZ(q, P.getZ(q) * k); }
        g2.computeVertexNormals(); g2.rotateY(sr() * 6); g2.translate(st.x, SEA_Y - 8 + H / 2, st.z); geos.push(g2);
        circles.push([st.x, st.z, st.r * 1.05, SEA_Y + st.h]);
      }
      for (const h of holes) if (h.w >= 6) for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
        const u = s * (h.w / 2 + 2 + sr() * 4), v = -2 - sr() * 3, sz = 1.2 + sr() * 1.8, x = h.cx - h.nx * v - h.nz * u, z = h.cz - h.nz * v + h.nx * u;
        const g2 = makeRock(sz, sz * 0.7, sz, sr(), 3); g2.rotateY(sr() * 6); g2.translate(x, SEA_Y - 0.4, z); geos.push(g2);
      }
      if (geos.length) { const m = new THREE.Mesh(mergeGeometries(geos, false), M(0xffffff, { vertexColors: true, map: rockTex, roughness: 0.95 })); m.castShadow = m.receiveShadow = true; m.userData.keep = true; scene.add(m); }
    }
    // Statische Quader/Zylinder je Material zu einem Netz zusammenfassen (weniger Zeichenaufrufe)
    {
      scene.updateMatrixWorld(true);
      const groups = new Map(), gone = [];
      scene.traverse(o => {
        if (!o.isMesh || o.isInstancedMesh || o.userData.keep) return;
        const m = o.material;
        if (Array.isArray(m) || m.transparent || m.vertexColors) return;
        for (let q = o.parent; q; q = q.parent) if (q.userData.dynamic) return;
        const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
        for (const k of Object.keys(g.attributes)) if (k !== "position" && k !== "normal" && k !== "uv") g.deleteAttribute(k);
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.attributes.uv) g.setAttribute("uv", new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        g.applyMatrix4(o.matrixWorld);
        const key = m.uuid + (o.castShadow ? "c" : "") + (o.receiveShadow ? "r" : "");
        if (!groups.has(key)) groups.set(key, { m, cast: o.castShadow, recv: o.receiveShadow, list: [] });
        groups.get(key).list.push(g);
        gone.push(o);
      });
      for (const o of gone) { o.parent.remove(o); o.geometry.dispose(); }
      for (const { m, cast, recv, list } of groups.values()) {
        const merged = new THREE.Mesh(mergeGeometries(list, false), m);
        merged.castShadow = cast; merged.receiveShadow = recv;
        scene.add(merged);
        list.forEach(g => g.dispose());
      }
    }
    requestAnimationFrame(() => { $("loading").remove(); });
    frame();

    // ?debug: Spieler und Umrechnung von aussen steuerbar (fuer Tests im Browser)
    if (location.search.includes("debug")) {
      window.manorDebug = { player, update: updatePlayer, setWalk, startWalk, startGhost, ghostStep, isGhost: () => ghost, terrainH, genH, forestD, LAKES, HOUSE, LIFT, updateLift, useLift, MAPS, showMap, seaD, groundAt, supportAt, SERP, serpNear, carLift: () => CAR_LIFT, WATER_CAVES, SEA_STACKS, waterCaveAt, GARAGE, HILL, plateauH, plateauSD, STOPS, caveAt, caveUpAt, toCave, LY, UY, STW, pickStop, stepStop, BOAT, useBoat, boatStep, boatFree, waterAt, gates, toggleGate, findAimedGate, solids, circles, camera, controls, renderer, scene, mp, mapMesh };
    }
