<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayne Manor 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ffd43b; --line: #2a2d35; --panel: rgba(16, 18, 24, .78); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px); max-width: calc(100% - 24px); }
    .panel button, .hud button { border: 0; background: none; color: var(--text); font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .panel button:hover, .hud button:hover { background: rgba(255, 255, 255, .08); }
    .panel button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .panel .big, .hud .big { background: var(--accent); color: #1a1405; font-weight: 800; padding: 10px 20px; }
    .panel .big:hover, .hud .big:hover { background: #ffe066; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none; }
    footer a { color: var(--accent); pointer-events: auto; }

    /* Laufmodus */
    .hud { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; gap: 8px; z-index: 5; }
    body.walk .hud { display: flex; }
    body.walk .panel, body.walk footer, body.walk .bar h1 { display: none; }
    .hud button { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    #cross { display: none; position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255, 255, 255, .8); border-radius: 50%; pointer-events: none; }
    body.walk.looking #cross { display: block; }
    #hint { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .78rem; color: var(--muted); text-align: center; pointer-events: none; }
    body.walk #hint { display: block; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; }
    #toast.show { opacity: 1; }
    .stick { display: none; position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .25); touch-action: none; z-index: 5; }
    .stick span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
    #stick-move { left: 22px; }
    #stick-look { right: 22px; }
    #btn-jump { display: none; position: fixed; right: 160px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: var(--text); font: inherit; font-size: .75rem; touch-action: none; z-index: 5; }
    body.touch.walk .stick, body.touch.walk #btn-jump { display: block; }
    body.touch #hint { display: none !important; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); background: #0b0d12; z-index: 9; }
    @media (max-width: 600px) { .bar h1 { display: none; } }
  </style>
</head>
<body>
  <div id="loading">Lade Wayne Manor...</div>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Wayne Manor &middot; 3D</h1>
    <span></span>
  </div>

  <div class="panel" role="group" aria-label="Steuerung">
    <button type="button" id="btn-walk-low" class="big">Begehen</button>
    <button type="button" id="btn-walk-top" aria-pressed="true">Karte</button>
    <button type="button" id="btn-night" aria-pressed="false">Nacht</button>
  </div>

  <div class="hud">
    <button type="button" id="btn-lift">Aufzug (E)</button>
    <button type="button" id="btn-exit">Beenden (Esc)</button>
  </div>
  <div id="cross"></div>
  <div id="hint">WASD gehen &middot; Linksklick Maus übernehmen &middot; Leertaste springen &middot; Shift rennen &middot; Esc beenden</div>
  <div id="toast"></div>
  <div class="stick" id="stick-move"><span></span></div>
  <div class="stick" id="stick-look"><span></span></div>
  <button type="button" id="btn-jump">Sprung</button>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script>
    // PWA: gemeinsamer Service Worker im Projekt-Root
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

    // Einheiten: 1 = 1 Meter. Welt nach dem Kompass der Karten: Norden = -z, Osten = +x (Hausfront und Hauptzufahrt zeigen nach Osten).
    // Karte -> Welt: Karte oben = Westen, rechts = Norden, unten = Osten, links = Sueden; 1 Kartenpixel = 0,4 m, Nullpunkt = Mitte des Rondells.
    const $ = id => document.getElementById(id);
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const sst = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // --- Renderer, Szene, Kamera ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, matchMedia("(pointer: coarse)").matches ? 1.25 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const SKY_DAY = new THREE.Color(0x8fc4e8), SKY_NIGHT = new THREE.Color(0x070b18);
    const scene = new THREE.Scene();
    scene.background = SKY_DAY.clone();
    scene.fog = new THREE.Fog(SKY_DAY.clone(), 350, 1500);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 3000);
    camera.position.set(190, 150, 120);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-50, 0, 20);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 900;
    controls.maxPolarAngle = Math.PI * 0.495;

    const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5a7a3a, 1.0);
    scene.add(hemi);
    const cave = new THREE.AmbientLight(0x6f8fd0, 0);
    scene.add(cave);
    const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
    const SUN_DIR = new THREE.Vector3(-0.4, 0.8, 0.5).normalize();
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 190 });
    sun.shadow.bias = -0.0004;
    scene.add(sun, sun.target);
    const world = new THREE.Group();
    scene.add(world);

    // --- Texturen und Materialien ---
    const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
    function canvasTex(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.repeat.set(rx, ry);
      return t;
    }
    const texClone = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
    const r1 = rng(11);
    const rockTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#8c8e94"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 700; i++) { const v = 90 + r1() * 90; g.fillStyle = `rgba(${v},${v},${v + 6},${0.1 + r1() * 0.25})`; g.beginPath(); g.arc(r1() * w, r1() * h, 3 + r1() * 16, 0, 7); g.fill(); }
      g.strokeStyle = "rgba(30,30,36,.35)"; g.lineWidth = 1.2;
      for (let i = 0; i < 26; i++) { g.beginPath(); let x = r1() * w, y = r1() * h; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r1() - .5) * 40; y += (r1() - .3) * 30; g.lineTo(x, y); } g.stroke(); }
    }, 1 / 8, 1 / 8);
    const brickTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#5b574f"; g.fillRect(0, 0, w, h);
      for (let row = 0; row < 16; row++) for (let i = -1; i < 8; i++) {
        const v = 128 + r1() * 40, x = i * 32 + (row % 2 ? 16 : 0);
        g.fillStyle = `rgb(${v},${v - 6},${v - 18})`; g.fillRect(x + 1, row * 16 + 1, 30, 14);
      }
    }, 1 / 4, 1 / 4);
    const woodTex = canvasTex(256, 256, (g, w, h) => {
      for (let i = 0; i < 8; i++) { const v = 90 + r1() * 40; g.fillStyle = `rgb(${v + 40},${v},${v - 30})`; g.fillRect(0, i * 32, w, 32); g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, i * 32, w, 2); }
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(40,20,5,${r1() * .15})`; g.fillRect(r1() * w, r1() * h, 30 + r1() * 60, 1); }
    }, 1 / 3, 1 / 3);
    const marbleTex = canvasTex(256, 256, (g, w, h) => {
      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? "#2b2b30" : "#d9d6cf"; g.fillRect(x * 128, y * 128, 128, 128); }
      g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, h); g.moveTo(0, 128); g.lineTo(w, 128); g.stroke();
    }, 1 / 2, 1 / 2);
    const mat = {
      rock: M(0xffffff, { map: rockTex, roughness: 1 }),
      rockDark: M(0x7d8088, { map: texClone(rockTex, 1 / 6, 1 / 6), roughness: 1, flatShading: true, side: THREE.BackSide }),
      brick: M(0xffffff, { map: brickTex, roughness: 0.95 }),
      slate: M(0x2c323d, { roughness: 0.55 }),
      floorWood: M(0xffffff, { map: woodTex }), marble: M(0xffffff, { map: marbleTex, roughness: 0.3 }),
      trim: M(0x3a2616), carpet: M(0x7a1f2b), gold: M(0xc9a24a, { metalness: 0.7, roughness: 0.35 }),
      steel: M(0x8b929c, { metalness: 0.6, roughness: 0.35 }), dark: M(0x1b1e24, { metalness: 0.3, roughness: 0.5 }),
      black: M(0x0e0f12, { roughness: 0.4 }), bat: M(0x14161b, { metalness: 0.55, roughness: 0.3 }),
      floorStone: M(0x32353d, { roughness: 0.9 }), concrete: M(0x6c6e72, { roughness: 0.95 }),
      white: M(0xf0efe9), cloth: M(0x4a5a78), red: M(0xb32d2d), green: M(0x3e7a45), wood: M(0x6a4526),
      glass: M(0x9fd0e6, { transparent: true, opacity: 0.38, roughness: 0.1, emissive: 0xffd27a, emissiveIntensity: 0 }),
      water: M(0x2e8fbf, { transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.1, emissive: 0x0b3550, emissiveIntensity: 0.4, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      glow: new THREE.MeshBasicMaterial({ color: 0xbfe6ff }), glowOrange: new THREE.MeshBasicMaterial({ color: 0xffa040 }),
      glowRed: new THREE.MeshBasicMaterial({ color: 0xff3b30 }),
      gravel: M(0xb2a891, { roughness: 1 }), leaves: M(0x2f6b3a, { roughness: 1, flatShading: true }), bark: M(0x5a3d22)
    };

    // Quader mit Texturkoordinaten in Metern; solid = Kollisionsquader (nur Welt-Gruppe)
    const solids = [];
    const circles = [];
    const S = (x0, x1, y0, y1, z0, z1, on = true) => { const s = { x0, x1, y0, y1, z0, z1, on }; solids.push(s); return s; };
    function boxUV(g, w, h, d) {
      const uv = g.attributes.uv, sc = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * sc[f][0], uv.getY(k) * sc[f][1]); }
    }
    function B(x0, x1, y0, y1, z0, z1, m, solid = true, parent = world, shadow = true) {
      const w = x1 - x0, h = y1 - y0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
      boxUV(g, w, h, d);
      const mesh = new THREE.Mesh(g, m);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      parent.add(mesh);
      if (solid && parent === world) S(x0, x1, y0, y1, z0, z1);
      return mesh;
    }
    function cyl(r0, r1, h, m, x, y, z, parent = world, seg = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m);
      mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    // Wand mit Oeffnungen [a0, a1, y0, y1, 'g' = Glasscheibe]
    function wall(axis, a0, a1, line, y0, y1, open, m, t = 0.8) {
      const seg = (a, b, ya, yb) => {
        if (yb - ya < 1e-3 || b - a < 1e-3) return;
        if (axis === "x") B(a, b, ya, yb, line - t / 2, line + t / 2, m); else B(line - t / 2, line + t / 2, ya, yb, a, b, m);
      };
      const cuts = [...new Set([a0, a1, ...open.flatMap(o => [o[0], o[1]])])].sort((p, q) => p - q);
      for (let k = 0; k < cuts.length - 1; k++) {
        const a = cuts[k], b = cuts[k + 1], mid = (a + b) / 2;
        const holes = open.filter(o => o[0] < mid && o[1] > mid).sort((p, q) => p[2] - q[2]);
        let y = y0;
        for (const h of holes) { seg(a, b, y, h[2]); y = h[3]; }
        seg(a, b, y, y1);
      }
      for (const o of open) if (o[4]) {
        if (axis === "x") B(o[0] + 0.05, o[1] - 0.05, o[2], o[3], line - 0.03, line + 0.03, mat.glass, false);
        else B(line - 0.03, line + 0.03, o[2], o[3], o[0] + 0.05, o[1] - 0.05, mat.glass, false);
      }
    }
    function gableRoof(x0, x1, z0, z1, y, rise, over, m) {
      const s = new THREE.Shape();
      s.moveTo(z0 - over, 0); s.lineTo(z1 + over, 0); s.lineTo((z0 + z1) / 2, rise); s.closePath();
      const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: x1 - x0 + 2 * over, bevelEnabled: false }), m);
      mesh.rotation.y = -Math.PI / 2;
      mesh.position.set(x1 + over, y, 0);
      mesh.castShadow = mesh.receiveShadow = true;
      world.add(mesh);
      return mesh;
    }

    const lights = [];
    const pLight = (color, I, dist, x, y, z) => { const l = { color: new THREE.Color(color), I, dist, pos: new THREE.Vector3(x, y, z) }; lights.push(l); return l; };

    // ===================== Karte -> Welt =====================
    const SC = 0.4, OX = 500, OY = 995, MAP_W = 861, MAP_H = 1202;
    const mp = (px, py) => [(py - OY) * SC, -(px - OX) * SC];                 // Karten-Pixel -> [x, z]

    // ===================== Gelaende (Schritt 2) =====================
    // Lage aus der kleinen Uebersichtskarte oben links (Massstab dort ca. 2,8-mal kleiner, Rondell bei 222/252):
    // Welt x = (py - 252) * 1,12, z = -(px - 222) * 1,12.
    const SITE = { x0: -200, x1: 150, z0: -175, z1: 270 };               // Anwesen (Kartenbereich) bleibt flach (y 0)
    const WATER_Y = -0.35, LIMIT_WORLD = 700;
    const hash2 = (i, j) => { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
    function vnoise(x, z) {
      const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
      return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v);
    }
    const fbm = (x, z) => vnoise(x, z) * 0.53 + vnoise(x * 2.1 + 17, z * 2.1 + 5) * 0.29 + vnoise(x * 4.3 + 3, z * 4.3 + 41) * 0.18;
    const LAKES = [
      { name: "Northwest Lake", cx: -238, cz: -110, rx: 44, rz: 70, s: 1.0, depth: 4 },
      { name: "Mideast Lake", cx: 205, cz: 205, rx: 88, rz: 82, s: 2.3, depth: 5 },   // gross: hier kommt der Wasserweg der Hoehle heraus (Lake Exit)
      { name: "Wasserfall-Teich", cx: -198, cz: -251, rx: 16, rz: 12, s: 4.1, depth: 2.5 }
    ];
    const wob = (L, a) => 1 + 0.12 * Math.sin(3 * a + L.s) + 0.07 * Math.sin(5 * a + 2 * L.s) + 0.04 * Math.sin(8 * a + 3 * L.s);
    function lakeD(L, x, z) { const ux = (x - L.cx) / L.rx, uz = (z - L.cz) / L.rz; return Math.hypot(ux, uz) / wob(L, Math.atan2(uz, ux)); }
    const LAWNS = [{ name: "West Lawn", cx: -185, cz: 40, rx: 50, rz: 80 }, { name: "South Lawn", cx: -40, cz: 228, rx: 65, rz: 42 }];
    const WATERFALL = { x: -198, z: -264 };                                  // Felskante nördlich vom Teich (Ausgang der Hoehle folgt in Schritt 8)
    const POLES = [[0, -260], [260, 0], [0, 260], [-260, 0]];
    const siteDist = (x, z) => Math.hypot(Math.max(SITE.x0 - x, 0, x - SITE.x1), Math.max(SITE.z0 - z, 0, z - SITE.z1));
    const inLawn = (x, z) => LAWNS.some(l => Math.hypot((x - l.cx) / l.rx, (z - l.cz) / l.rz) < 1);
    function genH(x, z) {
      let h = sst(0, 140, siteDist(x, z)) * fbm(x / 170 + 3, z / 170 + 9) * 16;          // sanfte Huegel ausserhalb des Anwesens
      h += 170 * sst(700, 1300, Math.hypot(x, z)) * (0.45 + 0.8 * fbm(x / 260 + 11, z / 260 + 2));   // Berge am Horizont
      for (const L of LAKES) h *= sst(1.0, 2.4, lakeD(L, x, z));                          // Seeufer flach
      const w = sst(25, 140, Math.abs(x - WATERFALL.x));
      h += 14 * sst(-262, -262 - lerp(14, 90, w), z) + 10 * sst(-300, -520, z);           // Nordhang, beim Wasserfall steil
      for (const L of LAKES) h -= L.depth * sst(1.0, 0.55, lakeD(L, x, z));
      return h;
    }
    // Walddichte 0..1 (North Forest, West Forest, sonst verstreute Gruppen)
    function forestD(x, z) {
      if (siteDist(x, z) < 8 || inLawn(x, z)) return 0;
      for (const L of LAKES) if (lakeD(L, x, z) < 1.25) return 0;
      if (Math.hypot(x - WATERFALL.x, z - WATERFALL.z - 6) < 32) return 0;
      let d = 0.08 + 0.55 * sst(0.6, 0.75, vnoise(x / 60, z / 60));
      if (z < -185 || (z < -150 && x > -260 && x < 40)) d = 0.9;
      if (x < -235) d = Math.max(d, 0.85);
      return d * sst(1000, 800, Math.hypot(x, z));
    }

    // Hoehenfeld: Gitter wird zur Mitte hin feiner (ca. 3 m am Anwesen, 22 m am Rand bei 1500 m)

      requestAnimationFrame(frame);
    }
    // Statische Quader/Zylinder je Material zu einem Netz zusammenfassen (weniger Zeichenaufrufe)
    {
      scene.updateMatrixWorld(true);
      const groups = new Map(), gone = [];
      scene.traverse(o => {
        if (!o.isMesh || o.isInstancedMesh || o.userData.keep) return;
        const m = o.material;
        if (Array.isArray(m) || m.transparent || m.vertexColors) return;
        for (let q = o.parent; q; q = q.parent) if (q.userData.dynamic) return;
        const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
        for (const k of Object.keys(g.attributes)) if (k !== "position" && k !== "normal" && k !== "uv") g.deleteAttribute(k);
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.attributes.uv) g.setAttribute("uv", new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        g.applyMatrix4(o.matrixWorld);
        const key = m.uuid + (o.castShadow ? "c" : "") + (o.receiveShadow ? "r" : "");
        if (!groups.has(key)) groups.set(key, { m, cast: o.castShadow, recv: o.receiveShadow, list: [] });
        groups.get(key).list.push(g);
        gone.push(o);
      });
      for (const o of gone) { o.parent.remove(o); o.geometry.dispose(); }
      for (const { m, cast, recv, list } of groups.values()) {
        const merged = new THREE.Mesh(mergeGeometries(list, false), m);
        merged.castShadow = cast; merged.receiveShadow = recv;
        scene.add(merged);
        list.forEach(g => g.dispose());
      }
    }
    requestAnimationFrame(() => { $("loading").remove(); });
    frame();

    // ?debug: Spieler und Umrechnung von aussen steuerbar (fuer Tests im Browser)
    if (location.search.includes("debug")) {
      window.manorDebug = { player, update: updatePlayer, setWalk, startWalk, terrainH, genH, forestD, LAKES, HOUSE, LIFT, updateLift, useLift, solids, circles, camera, controls, renderer, scene, mp, mapMesh };
    }
  </script>
