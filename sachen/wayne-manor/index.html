<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayne Manor 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">Lade Wayne Manor...</div>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Wayne Manor &middot; 3D</h1>
    <span></span>
  </div>

  <div class="panel" role="group" aria-label="Steuerung">
    <button type="button" id="btn-walk-low" class="big">Begehen</button>
    <button type="button" id="btn-ghost" title="Durch alles fliegen: WASD waagrecht, Leertaste hoch, C runter, Shift schneller, Esc zurück">Geist</button>
    <button type="button" id="btn-walk-top" aria-pressed="false">Karte: aus</button>
    <button type="button" id="btn-night" aria-pressed="false">Nacht</button>
    <button type="button" id="btn-below" aria-pressed="false">Von unten</button>
    <button type="button" id="btn-fs" aria-pressed="false" title="Vollbild (Taste F): sperrt Strg+W, Esc gedrückt halten zum Verlassen">Vollbild</button>
    <button type="button" id="btn-draw" aria-pressed="false" title="Farbig einzeichnen, nochmal klicken löscht die Zeichnung">Zeichnen</button>
    <!-- TEST: Teleport zum Testen, wird ganz am Ende entfernt -->
    <select id="teleport" aria-label="Teleport (Test)"><option value="">Teleport (Test)…</option></select>
  </div>

  <div class="hud">
    <button type="button" id="btn-act" title="Einsteigen/Aussteigen, Tor schalten (Taste E)">Aktion<span class="k"> (E)</span></button>
    <button type="button" id="btn-tp" title="Teleport-Menue, Fahrzeuge holen, Lautstaerke (Taste T)">Menü<span class="k"> (T)</span></button>
    <button type="button" id="btn-fs2" aria-pressed="false">Vollbild<span class="k"> (F)</span></button>
    <button type="button" id="btn-exit">Beenden<span class="k"> (Esc)</span></button>
  </div>
  <div id="cross"></div>
  <div id="ghost-tag">Geist</div>
  <div id="hint">WASD gehen &middot; Linksklick Maus übernehmen &middot; Leertaste springen &middot; Shift rennen &middot; Esc beenden</div>
  <div id="toast"></div>
  <canvas id="draw-layer"></canvas>
  <div id="draw-colors" role="group" aria-label="Stiftfarbe"></div>
  <div id="lift-panel" hidden></div>
  <button type="button" id="door-hint" hidden></button>
  <!-- TEST: Teleport-Menue (Taste T), wird ganz am Ende entfernt -->
  <div id="tp-menu" hidden><div class="tp-head">Teleport (Test) &middot; T oder Esc schließt</div><button type="button" id="tp-close" aria-label="Menü schließen">&times;</button><label class="tp-vol">Lautstärke <input id="tp-vol" type="range" min="0" max="100" step="5" value="25" aria-label="Lautstärke"><span id="tp-vol-v">25 %</span></label><details id="tp-orte"><summary>Orte</summary><div class="tp-list tp-orte"></div></details><details id="tp-veh"><summary>Fahrzeuge (zu dir holen)</summary><div class="tp-list tp-veh"></div></details></div>
  <div class="stick" id="stick-move"><span></span></div>
  <div class="stick" id="stick-look"><span></span></div>
  <button type="button" id="btn-jump">Sprung</button>
  <button type="button" id="btn-down">Runter</button>
  <!-- Handy: Fahrzeug-Tasten (V, R, L, M) als Knoepfe, sichtbar nur im Fahrzeug -->
  <div id="veh-btns" role="group" aria-label="Fahrzeug"><button type="button" data-key="KeyV">Kamera</button><button type="button" data-key="KeyR" class="car-only">Reset</button><button type="button" data-key="KeyL" class="car-only">Lift</button><button type="button" data-key="KeyM" class="no-boat">Ton</button></div>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script>
    // PWA: gemeinsamer Service Worker im Projekt-Root
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { installOrbitPick, PICK_ICONS } from "../../shared/orbit-pick.js";
    import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
    // Die Seite ist in klassische Skripte unter js/ aufgeteilt (gleicher globaler Bereich, Reihenfolge wie hier). Sie brauchen THREE und die Helfer global.
    Object.assign(window, { THREE, OrbitControls, installOrbitPick, PICK_ICONS, mergeGeometries, mergeVertices });
    const FILES = [
      "kern/basis.js",
      "gelaende/karte-kueste.js",
      "strassen/serpentine.js",
      "strassen/waterfall-exit.js",
      "strassen/hauptstrasse.js",
      "gelaende/gelaende.js",
      "haus/haus.js",
      "aufzuege/personenaufzug.js",
      "ui/karten-overlay.js",
      "aussen/aussenanlage.js",
      "hoehle/hoehle-unten.js",
      "hoehle/batcave-ausbau.js",
      "hoehle/hoehle-oben.js",
      "kern/tag-nacht.js",
      "spieler/laufen.js",
      "ui/teleport.js",
      "kern/tore.js",
      "fahrzeuge/boot.js",
      "fahrzeuge/motorton.js",
      "fahrzeuge/modelle.js",
      "fahrzeuge/fahren.js",
      "fahrzeuge/the-bat.js",
      "ui/bedienung.js",
      "kern/schleife.js",
      "gelaende/felsen.js",
      "strassen/serpentine-bau.js",
      "aussen/einfahrtstor.js",
      "aussen/grundmauer.js",
      "gelaende/wasserfall.js",
      "aufzuege/autoaufzug.js",
      "strassen/waterfall-exit-bau.js",
      "gelaende/steilkueste.js",
      "kern/start.js"
    ];
    for (const f of FILES) { const s = document.createElement("script"); s.src = "js/" + f; s.async = false; document.body.appendChild(s); }
  </script>
</body>
</html>
