<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayne-Berg 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ffd43b; --line: #2a2d35; --panel: rgba(16, 18, 24, .78); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
    .panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px); max-width: calc(100% - 24px); }
    .panel button, .hud button { border: 0; background: none; color: var(--text); font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .panel button:hover, .hud button:hover { background: rgba(255, 255, 255, .08); }
    .panel button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .panel .big, .hud .big { background: var(--accent); color: #1a1405; font-weight: 800; padding: 10px 20px; }
    .panel .big:hover, .hud .big:hover { background: #ffe066; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none; }
    footer a { color: var(--accent); pointer-events: auto; }

    /* Laufmodus */
    .hud { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; gap: 8px; z-index: 5; }
    body.walk .hud { display: flex; }
    body.walk .panel, body.walk footer, body.walk .bar h1 { display: none; }
    .hud button { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    #cross { display: none; position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border: 2px solid rgba(255, 255, 255, .8); border-radius: 50%; pointer-events: none; }
    body.walk.looking #cross { display: block; }
    #hint { display: none; position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: .78rem; color: var(--muted); text-align: center; pointer-events: none; }
    body.walk #hint { display: block; }
    #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; }
    #toast.show { opacity: 1; }
    .stick { display: none; position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: 120px; height: 120px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .25); touch-action: none; z-index: 5; }
    .stick span { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .35); }
    #stick-move { left: 22px; }
    #stick-look { right: 22px; }
    #btn-jump { display: none; position: fixed; right: 160px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: var(--text); font: inherit; font-size: .75rem; touch-action: none; z-index: 5; }
    body.touch.walk .stick, body.touch.walk #btn-jump { display: block; }
    body.touch #hint { display: none !important; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); background: #0b0d12; z-index: 9; }
    @media (max-width: 600px) { .bar h1 { display: none; } }
  </style>
</head>
<body>
  <div id="loading">Lade Wayne-Berg...</div>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Wayne-Berg &middot; 3D</h1>
    <span></span>
  </div>

  <div class="panel" role="group" aria-label="Steuerung">
    <button type="button" id="btn-walk-low" class="big">Zum Wasserfall</button>
    <button type="button" id="btn-walk-top">Zur Villa</button>
    <button type="button" id="btn-lift">Aufzug rufen</button>
    <button type="button" id="btn-night" aria-pressed="false">Nacht</button>
  </div>

  <div class="hud">
    <button type="button" id="btn-lift2" class="big">Aufzug (E)</button>
    <button type="button" id="btn-exit">Beenden (Esc)</button>
  </div>
  <div id="cross"></div>
  <div id="hint">WASD gehen &middot; Linksklick Maus übernehmen &middot; Leertaste springen &middot; Shift rennen &middot; E Aufzug rufen/fahren &middot; Esc beenden</div>
  <div id="toast"></div>
  <div class="stick" id="stick-move"><span></span></div>
  <div class="stick" id="stick-look"><span></span></div>
  <button type="button" id="btn-jump">Sprung</button>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script>
    // PWA: gemeinsamer Service Worker im Projekt-Root
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(() => {});
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Einheiten: 1 = 1 Meter. Der Berg liegt im Norden (-z), die Strasse/der Wasserfall schaut nach Sueden (+z).
    //   Gipfel-Plateau (y 30) um (0, -70) mit der Villa, rundlicher Berg, Bach aus dem Fels, Portal im Westen (x -100)
    //   mit Tunnel hinter dem Wasserfall, 60 m Tunnel bis zur Halle der Batcave (Ellipse um (0, -44)); Aufzug im Ostfluegel der Villa.
    const $ = id => document.getElementById(id);
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const sst = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    // --- Renderer, Szene, Kamera ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, matchMedia("(pointer: coarse)").matches ? 1.25 : 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const SKY_DAY = new THREE.Color(0x8fc4e8), SKY_NIGHT = new THREE.Color(0x070b18);
    const scene = new THREE.Scene();
    scene.background = SKY_DAY.clone();
    scene.fog = new THREE.Fog(SKY_DAY.clone(), 120, 520);
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 1200);
    camera.position.set(-95, 48, 55);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 22, -45);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 320;
    controls.maxPolarAngle = Math.PI * 0.495;

    const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5a7a3a, 1.0);
    scene.add(hemi);
    const cave = new THREE.AmbientLight(0x6f8fd0, 0);
    scene.add(cave);
    const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
    const SUN_DIR = new THREE.Vector3(-0.4, 0.8, 0.5).normalize();
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 190 });
    sun.shadow.bias = -0.0004;
    scene.add(sun, sun.target);
    const world = new THREE.Group();
    scene.add(world);

    // --- Texturen und Materialien ---
    const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
    function canvasTex(w, h, draw, rx = 1, ry = 1) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      draw(c.getContext("2d"), w, h);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.repeat.set(rx, ry);
      return t;
    }
    const texClone = (t, rx, ry) => { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
    const r1 = rng(11);
    const rockTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#8c8e94"; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 700; i++) { const v = 90 + r1() * 90; g.fillStyle = `rgba(${v},${v},${v + 6},${0.1 + r1() * 0.25})`; g.beginPath(); g.arc(r1() * w, r1() * h, 3 + r1() * 16, 0, 7); g.fill(); }
      g.strokeStyle = "rgba(30,30,36,.35)"; g.lineWidth = 1.2;
      for (let i = 0; i < 26; i++) { g.beginPath(); let x = r1() * w, y = r1() * h; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (r1() - .5) * 40; y += (r1() - .3) * 30; g.lineTo(x, y); } g.stroke(); }
    }, 1 / 8, 1 / 8);
    const brickTex = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = "#5b574f"; g.fillRect(0, 0, w, h);
      for (let row = 0; row < 16; row++) for (let i = -1; i < 8; i++) {
        const v = 128 + r1() * 40, x = i * 32 + (row % 2 ? 16 : 0);
        g.fillStyle = `rgb(${v},${v - 6},${v - 18})`; g.fillRect(x + 1, row * 16 + 1, 30, 14);
      }
    }, 1 / 4, 1 / 4);
    const woodTex = canvasTex(256, 256, (g, w, h) => {
      for (let i = 0; i < 8; i++) { const v = 90 + r1() * 40; g.fillStyle = `rgb(${v + 40},${v},${v - 30})`; g.fillRect(0, i * 32, w, 32); g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, i * 32, w, 2); }
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(40,20,5,${r1() * .15})`; g.fillRect(r1() * w, r1() * h, 30 + r1() * 60, 1); }
    }, 1 / 3, 1 / 3);
    const marbleTex = canvasTex(256, 256, (g, w, h) => {
      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? "#2b2b30" : "#d9d6cf"; g.fillRect(x * 128, y * 128, 128, 128); }
      g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, h); g.moveTo(0, 128); g.lineTo(w, 128); g.stroke();
    }, 1 / 2, 1 / 2);
    const mat = {
      rock: M(0xffffff, { map: rockTex, roughness: 1 }),
      rockDark: M(0x7d8088, { map: texClone(rockTex, 1 / 6, 1 / 6), roughness: 1, flatShading: true, side: THREE.BackSide }),
      brick: M(0xffffff, { map: brickTex, roughness: 0.95 }),
      slate: M(0x2c323d, { roughness: 0.55 }),
      floorWood: M(0xffffff, { map: woodTex }), marble: M(0xffffff, { map: marbleTex, roughness: 0.3 }),
      trim: M(0x3a2616), carpet: M(0x7a1f2b), gold: M(0xc9a24a, { metalness: 0.7, roughness: 0.35 }),
      steel: M(0x8b929c, { metalness: 0.6, roughness: 0.35 }), dark: M(0x1b1e24, { metalness: 0.3, roughness: 0.5 }),
      black: M(0x0e0f12, { roughness: 0.4 }), bat: M(0x14161b, { metalness: 0.55, roughness: 0.3 }),
      floorStone: M(0x32353d, { roughness: 0.9 }), concrete: M(0x6c6e72, { roughness: 0.95 }),
      white: M(0xf0efe9), cloth: M(0x4a5a78), red: M(0xb32d2d), green: M(0x3e7a45), wood: M(0x6a4526),
      glass: M(0x9fd0e6, { transparent: true, opacity: 0.38, roughness: 0.1, emissive: 0xffd27a, emissiveIntensity: 0 }),
      water: M(0x2e8fbf, { transparent: true, opacity: 0.8, roughness: 0.1, metalness: 0.1, emissive: 0x0b3550, emissiveIntensity: 0.4, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      glow: new THREE.MeshBasicMaterial({ color: 0xbfe6ff }), glowOrange: new THREE.MeshBasicMaterial({ color: 0xffa040 }),
      glowRed: new THREE.MeshBasicMaterial({ color: 0xff3b30 }),
      gravel: M(0xb2a891, { roughness: 1 }), leaves: M(0x2f6b3a, { roughness: 1, flatShading: true }), bark: M(0x5a3d22)
    };

    // Quader mit Texturkoordinaten in Metern; solid = Kollisionsquader (nur Welt-Gruppe)
    const solids = [];
    const circles = [];
    const S = (x0, x1, y0, y1, z0, z1, on = true) => { const s = { x0, x1, y0, y1, z0, z1, on }; solids.push(s); return s; };
    function boxUV(g, w, h, d) {
      const uv = g.attributes.uv, sc = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * sc[f][0], uv.getY(k) * sc[f][1]); }
    }
    function B(x0, x1, y0, y1, z0, z1, m, solid = true, parent = world, shadow = true) {
      const w = x1 - x0, h = y1 - y0, d = z1 - z0, g = new THREE.BoxGeometry(w, h, d);
      boxUV(g, w, h, d);
      const mesh = new THREE.Mesh(g, m);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      mesh.castShadow = shadow; mesh.receiveShadow = true;
      parent.add(mesh);
      if (solid && parent === world) S(x0, x1, y0, y1, z0, z1);
      return mesh;
    }
    function cyl(r0, r1, h, m, x, y, z, parent = world, seg = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m);
      mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    // Wand mit Oeffnungen [a0, a1, y0, y1, 'g' = Glasscheibe]
    function wall(axis, a0, a1, line, y0, y1, open, m, t = 0.8) {
      const seg = (a, b, ya, yb) => {
        if (yb - ya < 1e-3 || b - a < 1e-3) return;
        if (axis === "x") B(a, b, ya, yb, line - t / 2, line + t / 2, m); else B(line - t / 2, line + t / 2, ya, yb, a, b, m);
      };
      const cuts = [...new Set([a0, a1, ...open.flatMap(o => [o[0], o[1]])])].sort((p, q) => p - q);
      for (let k = 0; k < cuts.length - 1; k++) {
        const a = cuts[k], b = cuts[k + 1], mid = (a + b) / 2;
        const holes = open.filter(o => o[0] < mid && o[1] > mid).sort((p, q) => p[2] - q[2]);
        let y = y0;
        for (const h of holes) { seg(a, b, y, h[2]); y = h[3]; }
        seg(a, b, y, y1);
      }
      for (const o of open) if (o[4]) {
        if (axis === "x") B(o[0] + 0.05, o[1] - 0.05, o[2], o[3], line - 0.03, line + 0.03, mat.glass, false);
        else B(line - 0.03, line + 0.03, o[2], o[3], o[0] + 0.05, o[1] - 0.05, mat.glass, false);
      }
    }
    function gableRoof(x0, x1, z0, z1, y, rise, over, m) {
      const s = new THREE.Shape();
      s.moveTo(z0 - over, 0); s.lineTo(z1 + over, 0); s.lineTo((z0 + z1) / 2, rise); s.closePath();
      const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: x1 - x0 + 2 * over, bevelEnabled: false }), m);
      mesh.rotation.y = -Math.PI / 2;
      mesh.position.set(x1 + over, y, 0);
      mesh.castShadow = mesh.receiveShadow = true;
      world.add(mesh);
      return mesh;
    }

    const lights = [];
    const pLight = (color, I, dist, x, y, z) => { const l = new THREE.PointLight(color, I, dist, 2); l.position.set(x, y, z); scene.add(l); lights.push(l); return l; };

    // ===================== Gelaende =====================
    // Rundlicher Berg, ringsum gleich sanft abfallend. Der Hoehleneingang liegt im Westen (die Villa schaut nach Sueden):
    // ein Felsvorsprung (Portal) mit Rundbogen, dahinter ein langer Tunnel nach Osten in die Halle. Der Bach kommt weit
    // unterhalb des Gipfels aus dem Fels. Portal-Teile sind im lokalen Rahmen gebaut: lz = -x (zur Muendung hin), lx = z - CZ.
    const SUM = [0, -70], H_TOP = 30;
    const CZ = -44, BLK_H = 12, ARCH_W = 3.2, HALL_LZ = 30;
    const toL = (x, z) => [z - CZ, -x];
    const toW = (lx, lz) => [-lz, lx + CZ];
    const noise = (x, z) => Math.sin(x * 0.07 + 1.3) * Math.cos(z * 0.06) * 3 + Math.sin(x * 0.19 + z * 0.15) * 1.6 + Math.sin(x * 0.41 - z * 0.37) * 0.6;
    // Bergkette: flacher Gipfel mit der Villa, dazu ein Kamm in Ost-West-Richtung mit mehreren Kuppen; alles mit sanften Haengen
    const smax = (a, b) => (a + b + Math.hypot(a - b, 3)) / 2;
    function natBase(x, z) {
      const r = Math.hypot(x - SUM[0], z - SUM[1]);
      const plateau = H_TOP * (1 - sst(34, 110, r));
      const crest = 17 + 6 * Math.sin(x * 0.05 + 0.8) + 3.5 * Math.sin(x * 0.13 + 2.1) + 2 * Math.sin(x * 0.31);
      const ridge = crest * (1 - sst(0, 80, Math.abs(z - SUM[1] + 6 * Math.sin(x * 0.04)))) * (1 - sst(70, 160, Math.abs(x)));
      return smax(plateau, ridge) * (1 - sst(50, 90, -x)) + 30 * sst(150, 215, Math.hypot(x, z + 70));   // im Westen faellt der Berg zur Ebene ab (dort liegt der Eingang)
    }
    // Muendung des Tunnels im Westen: dort, wo das Gelaende auf Portalhoehe abgefallen ist
    const ZM = (() => { for (let x = -36; x > -200; x -= 0.5) if (natBase(x, CZ) < 12.8) return -x; return 90; })();
    const POOL_C = [0, ZM + 11];
    const SPRING_Z = ZM - 34;
    function natH(x, z) {
      const [lx, lz] = toL(x, z);
      return natBase(x, z) + noise(x, z) * 0.45 * sst(34, 60, Math.hypot(x, z + 70)) * sst(14, 40, Math.hypot(lx, lz - ZM));
    }
    // Felskante an der Muendung: das Gelaende bricht auf ca. 2,5 m zur Mulde ab, die Mulde laeuft breit und sanft in den Hang aus
    const CLIFF_W = 2.5;
    function terrainH(x, z) {
      const nat = natH(x, z), [lx, lz] = toL(x, z);
      const side = 1 - sst(7, 26, Math.abs(lx)), fade = 1 - sst(ZM + 10, ZM + 36, lz);
      const pool = -0.8 * (1 - sst(8, 14, Math.hypot(lx - POOL_C[0], (lz - POOL_C[1]) * 1.2)));
      return lerp(nat, pool, side * fade * sst(ZM, ZM + CLIFF_W, lz));
    }
    // Ist die Stelle in der Halle (unter dem Berg)?
    const hallU = (x, z, a = 1, b = 1) => Math.hypot(x / (34 * a), (z + 44) / (28 * b));
    function groundAt(x, z, feet) {
      if (x > 20.85 && x < 24.75 && z > -61.15 && z < -57.25) return 0;   // im Aufzugschacht traegt nur der Fahrstuhl, das Gelaende (Rasen) darueber zaehlt nicht
      const th = terrainH(x, z), [lx, lz] = toL(x, z);
      if (lz > HALL_LZ - 0.1 && lz < ZM + CLIFF_W + 1 && Math.abs(lx) < ARCH_W + 0.5 && (feet < th - 2 || th < 7.5)) return -1;   // im Tunnel traegt der Tunnelboden, das Gelaende liegt darueber
      return feet < th - 3 && hallU(x, z) < 1.02 ? 0 : th;
    }
    {
      const N = 270, SIZE = 440, geo = new THREE.PlaneGeometry(SIZE, SIZE, N, N).rotateX(-Math.PI / 2);
      const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) pos.setY(i, terrainH(pos.getX(i), pos.getZ(i)));
      geo.computeVertexNormals();
      const nor = geo.attributes.normal, rock = new THREE.Color(0x6f7176), grassA = new THREE.Color(0x35692c), grassB = new THREE.Color(0x2c5a26), lawn = new THREE.Color(0x3a7430);
      for (let i = 0; i < pos.count; i++) {

    pLight(0xffffff, 200, 40, 0, 9, -40); pLight(0xffa860, 150, 30, 18, 6, -58); pLight(0x6ab8ff, 120, 30, -20, 6, -60); pLight(0x4aa8ff, 80, 22, 0, 4.5, -13);
    // Fledermaeuse unter der Decke

    batMesh.frustumCulled = false;

    const batState = Array.from({ length: BATS }, () => ({ a: r1() * 6.28, r: 6 + r1() * 20, h: 12 + r1() * 5, s: (0.25 + r1() * 0.35) * (r1() < 0.5 ? -1 : 1), p: r1() * 6.28 }));

    const signal = new THREE.Sprite(new THREE.SpriteMaterial({ map: sigTex, transparent: true, opacity: 0, depthWrite: false, fog: false }));
    signal.scale.set(70, 70, 1); signal.position.set(-120, 120, -10);

    const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 4, 14, 8, 1, true), new THREE.MeshBasicMaterial({ color: 0xfff3a8, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide, fog: false }));

    const starGeo = new THREE.BufferGeometry(), sp = [];
    for (let i = 0; i < 900; i++) { const a = r1() * 6.28, e = 0.1 + r1() * 1.4, r = 700; sp.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, transparent: true, opacity: 0, fog: false, sizeAttenuation: false }));
    stars.frustumCulled = false;
    scene.add(stars);
    const clouds = new THREE.Group(); scene.add(clouds);
    for (let i = 0; i < 16; i++) {
      const c = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, fog: false }));
      c.scale.set(30 + r1() * 30, 7 + r1() * 5, 20 + r1() * 12);
      c.position.set((r1() - 0.5) * 520, 130 + r1() * 70, (r1() - 0.5) * 520);
      clouds.add(c);
    }

    // ===================== Tag und Nacht =====================
    let night = 0, nightTarget = 0, caveMix = 0;
    const SUN_DAYC = new THREE.Color(0xfff2d6), SUN_NIGHTC = new THREE.Color(0x7f9ce8);
    function applyNight() {
      scene.background.copy(SKY_DAY).lerp(SKY_NIGHT, night);
      scene.fog.color.copy(scene.background);
      sun.color.copy(SUN_DAYC).lerp(SUN_NIGHTC, night);
      mat.glass.emissiveIntensity = night * 0.9;
      stars.material.opacity = night; signal.material.opacity = night; beam.material.opacity = night * 0.0;
      for (const c of clouds.children) c.material.color.setScalar(lerp(1, 0.18, night));
      applyLights();
    }
    function applyLights() {
      sun.intensity = lerp(2.4, 0.5, night) * (1 - caveMix);
      hemi.intensity = lerp(1.0, 0.16, night) * (1 - caveMix * 0.93);
      cave.intensity = 0.38 * caveMix;
    }
    applyNight();

    // ===================== Laufmodus =====================
    const touch = matchMedia("(pointer: coarse)").matches;
    document.body.classList.toggle("touch", touch);
    const EYE = 1.62, BODY = 1.8, RADIUS = 0.3, STEP = 0.45, WALK = 4.6, RUN = 7.5, JUMP = 6.4, GRAVITY = 22, LIMIT = 150;
    const player = { pos: new THREE.Vector3(-(ZM + 34), 0, CZ), vy: 0, yaw: 0, pitch: 0.1, onGround: true, jump: false };
    const keys = new Set();
    let walking = false, dragging = false, jumpHeld = false;
    const orbitView = { pos: new THREE.Vector3(), target: new THREE.Vector3() };

    function pushOut(p, feet) {
      for (const s of solids) {
        if (!s.on || s.y1 <= feet + STEP || s.y0 >= feet + BODY) continue;
        const cx = Math.max(s.x0, Math.min(p.x, s.x1)), cz = Math.max(s.z0, Math.min(p.z, s.z1));

    function updatePlayer(dt, moveX, moveZ, run) {
      const len = Math.hypot(moveX, moveZ);

    function useLift() {

      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===================== Schleife =====================
    const clock = new THREE.Clock(), mt = new THREE.Matrix4(), qb = new THREE.Quaternion(), vb = new THREE.Vector3(), sb = new THREE.Vector3(), eb = new THREE.Euler();

      const dt = Math.min(clock.getDelta(), 0.05);

      if (walking) walkStep(dt); else controls.update();
      updateLift(dt);
      if (walking && LIFT.state === "moving") {                  // im Fahrstuhl mitfahren (auch beim Absenken)
        const p = player.pos;
        if (p.x > 21.1 && p.x < 24.5 && p.z > -60.9 && p.z < -57.5 && p.y > LIFT.y - 1.5 && p.y < LIFT.y + 1.5) { p.y = LIFT.y; player.vy = 0; player.onGround = true; camera.position.y = p.y + EYE; }
      }

      const cmTarget = inside ? 1 : 0, cmNew = caveMix + (cmTarget - caveMix) * Math.min(1, dt * 5);

      sun.target.position.copy(focus);

        const v = mistV[i]; v[1] = (v[1] + dt * (0.12 + v[0] * 0.04)) % 1;

        mistPos[i * 3 + 2] = ZM + CLIFF_W + 1.6 + ((i * 37) % 10) * 0.22 + v[1] * 2.5;
      }

      for (let i = 0; i < BATS; i++) {
        const b = batState[i];
        b.a += b.s * dt;
        const x = HALL.cx + Math.cos(b.a) * b.r * 1.3, z = HALL.cz + Math.sin(b.a) * b.r * 1.05, y = Math.min(b.h + Math.sin(time * 1.3 + b.p) * 1.3, domeY(x, z) - 1.2);

      clouds.position.x = Math.sin(time * 0.01) * 20;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(() => { $("loading").remove(); });
    frame();

    // ?debug: Spieler und Aufzug von aussen steuerbar (fuer Tests im Browser)
    if (location.search.includes("debug")) {
      window.wayneDebug = { player, update: updatePlayer, setWalk, startWalk, terrainH, solids, circles, camera, renderer, scene, LIFT, updateLift, useLift, groundAt, pushOut, setNight: v => { nightTarget = night = v; applyNight(); } };
    }
