<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iron Man Anzug 3D – random</title>
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --text: #ecebe6; --muted: #9b9a94; --accent: #ff8a4c; --line: #2a2d35; --panel: rgba(16, 18, 24, .72); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    .bar {
      position: fixed; left: 0; right: 0; top: 0;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .bar a { color: var(--text); text-decoration: none; font-weight: 600; }
    .bar a span { color: var(--accent); }
    .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
    .controls {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
      backdrop-filter: blur(8px); max-width: calc(100% - 32px);
    }
    .controls button {
      border: 0; background: none; color: var(--text); font: inherit; font-size: .88rem;
      padding: 7px 12px; border-radius: 8px; cursor: pointer;
    }
    .controls button:hover { background: rgba(255, 255, 255, .07); }
    .controls button[aria-pressed="true"] { background: var(--text); color: #0b0d12; }
    .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
      font-size: .8rem; color: var(--muted); text-align: center; pointer-events: none;
    }
    footer a { color: var(--accent); pointer-events: auto; }
    .hint { color: var(--muted); font-size: .8rem; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">&larr; random<span>.</span></a>
    <h1>Iron Man Anzug &middot; 3D</h1>
    <span class="hint">Ziehen zum Drehen, Scrollen zum Zoomen</span>
  </div>

  <div id="loading">Lade 3D-Ansicht...</div>

  <div class="controls" role="group" aria-label="Steuerung">
    <button type="button" id="btn-rotate" aria-pressed="true">Auto-Rotation</button>
    <button type="button" id="btn-power" aria-pressed="true">Energie</button>
    <button type="button" id="btn-mask" aria-pressed="false">Maske offen</button>
    <button type="button" id="btn-reset">Ansicht zuruecksetzen</button>
  </div>

  <footer>Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></footer>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    // Renderer, Szene, Kamera
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);
    document.getElementById("loading").remove();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);
    scene.fog = new THREE.Fog(0x0b0d12, 6, 14);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    const HOME_POS = new THREE.Vector3(2.6, 1.6, 3.4);
    const HOME_TARGET = new THREE.Vector3(0, 1.0, 0);
    camera.position.copy(HOME_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(HOME_TARGET);
    controls.enableDamping = true;
    controls.minDistance = 1.2;
    controls.maxDistance = 8;
    controls.maxPolarAngle = Math.PI * 0.55;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;

    // Licht
    scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1410, 0.4));
    const fill = new THREE.DirectionalLight(0xfff1e0, 0.8);
    fill.position.set(-2, 2, 5);
    scene.add(fill);
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(3, 5, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -2; key.shadow.camera.right = 2;
    key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x6cb4f5, 1.6);
    rim.position.set(-4, 3, -3);
    scene.add(rim);

    // Boden
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(3, 64),
      new THREE.MeshStandardMaterial({ color: 0x0f1116, metalness: 0.2, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.62, 0.66, 64),
      new THREE.MeshBasicMaterial({ color: 0x6cdcff, transparent: true, opacity: 0.5 })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.002;
    scene.add(ring);

    // Materialien
    const red = new THREE.MeshStandardMaterial({ color: 0x8e0f1a, metalness: 0.85, roughness: 0.28 });
    const gold = new THREE.MeshStandardMaterial({ color: 0xf0c25a, metalness: 0.9, roughness: 0.25 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x26272c, metalness: 0.7, roughness: 0.45 });
    const glow = new THREE.MeshStandardMaterial({ color: 0x0a1a20, emissive: 0x4fdcff, emissiveIntensity: 2.4 });

    const suit = new THREE.Group();
    scene.add(suit);

    function part(geo, mat, x = 0, y = 0, z = 0, parent = suit) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }
    const capsule = (r, len) => new THREE.CapsuleGeometry(r, len, 8, 20);
    const sphere = (r) => new THREE.SphereGeometry(r, 32, 24);

    // Beine (gespiegelt)
    for (const s of [-1, 1]) {
      const x = 0.12 * s;
      part(new THREE.BoxGeometry(0.15, 0.11, 0.28), red, x, 0.055, 0.04);       // Stiefel
      part(new THREE.BoxGeometry(0.155, 0.025, 0.285), gold, x, 0.012, 0.04);
      part(capsule(0.072, 0.36), red, x, 0.34, 0);
      part(new THREE.BoxGeometry(0.06, 0.22, 0.03), gold, x, 0.36, 0.066);   // Schienbein-Leiste
      part(sphere(0.075), gold, x, 0.56, 0.01);                               // Knie
      part(capsule(0.092, 0.34), red, x, 0.78, 0);
      part(new THREE.BoxGeometry(0.1, 0.2, 0.03), gold, x, 0.8, 0.085);       // Oberschenkel-Platte
    }

    // Huefte und Bauch
    part(new THREE.BoxGeometry(0.38, 0.14, 0.22), red, 0, 1.0, 0);
    part(new THREE.BoxGeometry(0.4, 0.035, 0.235), dark, 0, 1.07, 0);
    for (let i = 0; i < 3; i++) {
      const w = 0.3 - i * 0.02;
      part(new THREE.BoxGeometry(w, 0.05, 0.2), gold, 0, 1.11 + i * 0.055, 0.005);
    }

    // Brustkorb
    const torso = part(new THREE.CylinderGeometry(0.25, 0.16, 0.36, 40), red, 0, 1.37, 0);
    torso.scale.z = 0.62;
    const chestTop = part(sphere(1), red, 0, 1.55, 0);
    chestTop.scale.set(0.25, 0.08, 0.155);
    for (const s of [-1, 1]) {
      const plate = part(sphere(1), gold, 0.11 * s, 1.43, 0.03);
      plate.scale.set(0.085, 0.1, 0.12);
    }
    part(new THREE.CylinderGeometry(0.06, 0.07, 0.08, 24), dark, 0, 1.64, 0);  // Hals

    // Arc-Reaktor
    const reactor = new THREE.Group();
    reactor.position.set(0, 1.46, 0.152);
    suit.add(reactor);
    const rimMesh = part(new THREE.TorusGeometry(0.048, 0.012, 12, 40), gold, 0, 0, 0, reactor);
    rimMesh.castShadow = false;
    part(new THREE.CircleGeometry(0.042, 32), glow, 0, 0, 0.004, reactor);
    const reactorLight = new THREE.PointLight(0x9ff3ff, 1.2, 1.2, 2);
    reactorLight.position.set(0, 0, 0.08);
    reactor.add(reactorLight);

    // Kopf
    const head = new THREE.Group();
    head.position.set(0, 1.79, 0);
    suit.add(head);
    const helmet = part(sphere(1), red, 0, 0, -0.01, head);
    helmet.scale.set(0.115, 0.14, 0.13);
    const faceplate = new THREE.Group();
    head.add(faceplate);
    const face = part(sphere(1), gold, 0, -0.01, 0.035, faceplate);
    face.scale.set(0.1, 0.125, 0.1);
    for (const s of [-1, 1]) {
      const eye = part(new THREE.BoxGeometry(0.042, 0.011, 0.01), glow, 0.038 * s, 0.015, 0.13, faceplate);
      eye.rotation.z = -0.12 * s;
      eye.castShadow = false;
    }
    part(new THREE.BoxGeometry(0.05, 0.006, 0.01), dark, 0, -0.07, 0.13, faceplate);  // Mundschlitz

    // Arme (gespiegelt, Drehpunkt an der Schulter)
    const palms = [];
    for (const s of [-1, 1]) {
      part(sphere(0.1), red, 0.31 * s, 1.56, 0);                          // Schulter
      const sp = part(sphere(1), gold, 0.33 * s, 1.6, 0);
      sp.scale.set(0.07, 0.045, 0.09);

      const arm = new THREE.Group();
      arm.position.set(0.33 * s, 1.55, 0);
      arm.rotation.z = 0.12 * s;
      suit.add(arm);
      part(capsule(0.064, 0.2), red, 0, -0.16, 0, arm);
      part(sphere(0.06), gold, 0, -0.32, 0, arm);                          // Ellbogen
      part(capsule(0.062, 0.2), red, 0, -0.47, 0.01, arm);
      const band = part(new THREE.TorusGeometry(0.066, 0.012, 10, 32), gold, 0, -0.52, 0.01, arm);
      band.rotation.x = Math.PI / 2;
      part(new THREE.BoxGeometry(0.075, 0.1, 0.045), red, 0, -0.66, 0.01, arm);  // Hand
      const palm = part(new THREE.CircleGeometry(0.02, 24), glow, -0.039 * s, -0.66, 0.01, arm);
      palm.rotation.y = -Math.PI / 2 * s;
      palm.castShadow = false;
      palms.push(palm);
    }

    // Steuerung
    let power = true;
    let maskOpen = false;
    let maskT = 0;

    function bindToggle(id, onChange) {
      const btn = document.getElementById(id);
      btn.addEventListener("click", () => {
        const next = btn.getAttribute("aria-pressed") !== "true";
        btn.setAttribute("aria-pressed", String(next));
        onChange(next);
      });
    }
    bindToggle("btn-rotate", v => { controls.autoRotate = v; });
    bindToggle("btn-power", v => { power = v; });
    bindToggle("btn-mask", v => { maskOpen = v; });
    document.getElementById("btn-reset").addEventListener("click", () => {
      camera.position.copy(HOME_POS);
      controls.target.copy(HOME_TARGET);
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      const pulse = power ? 2.0 + Math.sin(t * 3) * 0.6 : 0;
      glow.emissiveIntensity += (pulse - glow.emissiveIntensity) * 0.15;
      reactorLight.intensity = glow.emissiveIntensity * 0.5;
      ring.material.opacity = 0.15 + glow.emissiveIntensity * 0.15;

      // Maske klappt nach oben
      maskT += ((maskOpen ? 1 : 0) - maskT) * 0.12;
      faceplate.position.set(0, maskT * 0.09, -maskT * 0.03);
      faceplate.rotation.x = -maskT * 0.9;

      // leichtes Schweben
      suit.position.y = Math.sin(t * 1.5) * 0.01;
      head.rotation.y = Math.sin(t * 0.5) * 0.15;

      controls.update(dt);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
